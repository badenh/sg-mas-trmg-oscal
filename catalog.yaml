      title: Footnote 21 (p. 34)
      description: 'Multi-factor authentication refers to the use of two or more factors
        to verify a user’s claimed identity. Such factors include, but are not limited
        to: (a) something that the user knows such as a password or a PIN number;
        (b) something that the user has such as a cryptographic identification device
        or token; and (c) something that the user is such as his biometrics or behaviour.'
