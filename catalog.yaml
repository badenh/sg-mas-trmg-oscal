        for the IP address ranges and known URLs; and b) greybox testing, which refers
        to testing with credentials. The security assessor is authenticated using
        the same rights as a normal customer Adapted from ABS Penetration Testing
        Guidelines for the Financial Industry in Singapore, 31 July 2015.'
