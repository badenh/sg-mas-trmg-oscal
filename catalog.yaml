    - uuid: 8556e366-106c-58bc-9fce-caeb9e41ff05
      title: Footnote 35 (p. 49)
      description: In a MITMA attack, an interloper is able to read, insert and modify
        messages between two communicating parties without either one knowing that
        the communication between them has been compromised. Possible attack points
        for MITMA could be within customer computers, internal networks, information
        service providers, web servers or anywhere in the Internet along the path
        between the customer and the FI’s server.
