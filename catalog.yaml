    - uuid: 60d46d73-ef6b-5335-9443-65f715c79d02
      title: Application Security Testing
      description: 'A.1 Application security testing aims to identify and remediate
        exploitable loopholes and weaknesses in software applications that could result
        in data leakage, disruption to business operations, financial losses and reputational
        damage. A good application security testing practice requires proactive security
        assurance techniques to be built into the various phases of the SDLC. A.2
        Common testing methods for identifying security vulnerabilities in software
        applications include: Static Application Security Testing Static Application
        Security Testing (SAST) involves a set of tools or technologies designed to
        scan and analyse static source codes, byte codes and binaries for coding and
        design flaws indicative of security vulnerabilities. The tester will have
        full internal knowledge of the IT system including architecture and design
        specifications, source codes or configuration files to guide the testing.
        Dynamic Application Security Testing Dynamic Application Security Testing
        (DAST) invol'
      props:
      - name: label
        value: annex-a
        ns: https://baden.id/ns/trmg
      - name: type
        value: annex
        ns: https://baden.id/ns/trmg
      rlinks:
      - href: https://www.mas.gov.sg/-/media/mas/regulations-and-financial-stability/regulatory-and-supervisory-framework/risk-management/trm-guidelines-18-january-2021.pdf
        media-type: application/pdf
    - uuid: 30a889c2-bc2d-5254-b041-0814e5451e11
      title: BYOD Security
      description: 'B.1 The FI should implement data loss prevention measures on personal
        computing or mobile devices that are used to access the FI’s information assets.
        Two common ways to address BYOD security are the use of mobile device or application
        management, as well as virtualisation solutions. These solutions can be augmented
        with other security measures for personal devices to provide enhanced functionalities:
        Mobile Device or Application Management Mobile Device Management (MDM) solutions
        are used to manage and control mobile devices used to access the FI’s resources
        while Mobile Application Management (MAM) are used to manage and control the
        access at the application. Before a personal device or application is permitted
        to access the FI’s network, the device is verified to ensure it has not been
        “jailbroken”, “rooted” or compromised. MDM and MAM solutions usually come
        with storage encryption, “lock and wipe” capabilities, enforced authentication
        policies and can be used in conjunction with ot'
      props:
      - name: label
        value: annex-b
        ns: https://baden.id/ns/trmg
      - name: type
        value: annex
        ns: https://baden.id/ns/trmg
      rlinks:
      - href: https://www.mas.gov.sg/-/media/mas/regulations-and-financial-stability/regulatory-and-supervisory-framework/risk-management/trm-guidelines-18-january-2021.pdf
        media-type: application/pdf
    - uuid: 9828935d-f866-5317-a2b4-559d3c1d6c79
      title: Mobile Application Security
      description: 'C.1 Security measures that should be considered for securing mobile
        applications are as follows: avoid storing or caching data in the mobile application
        to mitigate the risk of data compromise on the device. Data should be stored
        in a protected and trusted area of the mobile device; protect private cryptographic
        keys; implement anti-hooking or anti-tampering mechanisms to prevent injection
        of malicious code that could alter or monitor the behaviour of the application
        at runtime; implement appropriate application integrity check (e.g. using
        checksum and digital signature) to verify the authenticity and integrity of
        the application and code obfuscation techniques to prevent reverse engineering
        of the mobile application; implement certificate or public key pinning to
        protect against MITMA; implement a secure in-app keypad to mitigate against
        malware that captures keystrokes; and implement device binding to protect
        the software token from being cloned.'
      props:
      - name: label
        value: annex-c
        ns: https://baden.id/ns/trmg
      - name: type
        value: annex
        ns: https://baden.id/ns/trmg
      rlinks:
      - href: https://www.mas.gov.sg/-/media/mas/regulations-and-financial-stability/regulatory-and-supervisory-framework/risk-management/trm-guidelines-18-january-2021.pdf
        media-type: application/pdf
    - uuid: d3bc5a1a-f3d5-5ecf-b3ce-70d616be9855
      title: Footnote 1 (p. 7)
      description: “chief information officer”, “chief technology officer”, or “head
        of information technology”, who is principally responsible for establishing
        and implementing the overall information technology strategy, overseeing the
        day-to-day information technology operations, and managing the information
        technology risks of the financial institution. “chief information security
        officer” or “head of information security”, who is principally responsible
        for the information security strategy and programme of the financial institution,
        including but not limited to information security policies and procedures
        to safeguard information assets, information security controls, and the management
        of information security. - Guidelines on Individual Accountability and Conduct,
        Annex B
      props:
