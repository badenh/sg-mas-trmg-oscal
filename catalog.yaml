      description: Table-top exercise is a discussion-based exercise where personnel
        with roles and responsibilities in a particular IT plan meet in a classroom
        setting or in breakout groups to validate the content of the plan by discussing
        their roles during an emergency and their responses to a particular emergency
        situation. A facilitator initiates the discussion by presenting a scenario
        and asking questions based on the scenario. Adapted from NIST SP 800-84, Guide
        to Test, Training, and Exercise Programs for IT Plans and Capabilities, September
        2006.
      props:
      - name: label
        value: '30'
