  groups:
  - id: trmg-g-1
    class: trmg-chapter
    title: Preface
    props:
    - name: label
      value: '1'
    controls:
    - id: trmg-1.1
      class: trmg-guideline
      title: TRMG 1.1
      props:
      - name: label
        value: '1.1'
      - name: source-page
        value: '5'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-1.1_smt
        name: statement
        prose: The technology landscape of the financial sector is transforming at
          a rapid pace and the underlying information technology (IT) infrastructure
          supporting financial services has grown in scope and complexity in recent
          years. Many financial institutions (FIs) are riding the wave of digitalisation
          to increase operational efficiency and to deliver better services to consumers.
    - id: trmg-1.2
      class: trmg-guideline
      title: TRMG 1.2
      props:
      - name: label
        value: '1.2'
      - name: source-page
        value: '5'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-1.2_smt
        name: statement
        prose: Digital transformation in the financial sector can be broadly characterised
          by the adoption of new technology and the use of existing technology in
          innovative ways to achieve greater automation and enrich financial service
          offerings.
    - id: trmg-1.3
      class: trmg-guideline
      title: TRMG 1.3
      props:
      - name: label
        value: '1.3'
      - name: source-page
        value: '5'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-1.3_smt
        name: statement
        prose: While digital transformation brings significant benefits to the financial
          ecosystem, it also increases FIs’ exposure to a range of technology risks,
          including cyber risk. The techniques used by cyber threat actors are becoming
          increasingly sophisticated, and weak links in the interconnected financial
          ecosystem can be compromised to carry out fraudulent financial transactions,
          exfiltrate sensitive financial data or disrupt IT systems that support financial
          services. Hence, each FI should seek to understand their exposure to technology
          risks and put in place a robust risk management framework to ensure IT and
          cyber resilience.
    - id: trmg-1.4
      class: trmg-guideline
      title: TRMG 1.4
      props:
      - name: label
        value: '1.4'
      - name: source-page
        value: '5'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-1.4_smt
        name: statement
        prose: 'The revised MAS Technology Risk Management Guidelines set out technology
          risk management principles and best practices for the financial sector,
          to guide FIs in the following: (a) Establish Sound and Robust Technology
          Risk Governance and Oversight The board of directors and senior management
          at an FI play an integral part in the oversight and management of technology
          risk. The board of directors and senior management should cultivate a strong
          risk culture, and ensure the establishment of a sound and robust technology
          risk management framework. (b) Maintain Cyber Resilience Strong cyber resilience
          is critical for sustaining trust and confidence in financial services. FIs
          should adopt a defence-in-depth approach to strengthening cyber resilience.
          It is also important that FIs establish and continuously improve their IT
          processes and controls to preserve confidentiality, integrity and availability
          of data and IT systems.'
  - id: trmg-g-2
    class: trmg-chapter
    title: Application of the MAS Technology Risk Management Guidelines
    props:
    - name: label
      value: '2'
    controls:
    - id: trmg-2.1
      class: trmg-guideline
      title: TRMG 2.1
      props:
      - name: label
        value: '2.1'
      - name: source-page
        value: '6'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-2.1_smt
        name: statement
        prose: The aim of the MAS Technology Risk Management Guidelines (hereafter
          referred as “the Guidelines”) is to promote the adoption of sound and robust
          practices for the management of technology risk.
    - id: trmg-2.2
      class: trmg-guideline
      title: TRMG 2.2
      props:
      - name: label
        value: '2.2'
      - name: source-page
        value: '6'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-2.2_smt
        name: statement
        prose: The Guidelines do not affect, and should not be regarded as a statement
          of the standard of care owed by FIs to their customers. The extent and degree
          to which an FI implements the Guidelines should be commensurate with the
          level of risk and complexity of the financial services offered and the technologies
          supporting such services. In supervising an FI, the degree of observance
          with the spirit of the Guidelines by an FI is an area of consideration by
          MAS.
    - id: trmg-2.3
      class: trmg-guideline
      title: TRMG 2.3
      props:
      - name: label
        value: '2.3'
      - name: source-page
        value: '6'
        ns: https://baden.id/ns/trmg
      parts:
      - id: trmg-2.3_smt
        name: statement
        prose: These Guidelines provide general guidance, and are not intended to
          be comprehensive nor replace or override any legislative provisions. They
          should be read in conjunction with the provisions of the relevant legislation,
          the subsidiary legislation made under the relevant legislation, as well
          as written directions, notices, codes and other guidelines that MAS may
          issue from time to time pursuant to the relevant legislation and subsidiary
          legislation.
  - id: trmg-g-3
    class: trmg-chapter
    title: Technology Risk Governance and Oversight
    props:
    - name: label
      value: '3'
    groups:
    - id: trmg-g-3.1
      class: trmg-section
      title: Role of the Board of Directors and Senior Management
      props:
      - name: label
        value: '3.1'
      controls:
      - id: trmg-3.1.1
        class: trmg-guideline
        title: TRMG 3.1.1
        props:
        - name: label
          value: 3.1.1
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.1_smt
          name: statement
          prose: Technology is a key business enabler in the financial sector and
            FIs rely on technology to deliver financial services. It is vital that
            the FI’s board of directors and senior management ensure effective internal
            controls and risk management practices are implemented to achieve security,
            reliability and resilience of its IT operating environment.
      - id: trmg-3.1.2
        class: trmg-guideline
        title: TRMG 3.1.2
        props:
        - name: label
          value: 3.1.2
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.2_smt
          name: statement
          prose: Both the board of directors and senior management should have members
            with the knowledge to understand and manage technology risks, which include
            risks posed by cyber threats.
      - id: trmg-3.1.3
        class: trmg-guideline
        title: TRMG 3.1.3
        props:
        - name: label
          value: 3.1.3
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.3_smt
          name: statement
          prose: The board of directors and senior management should ensure a Chief
            Information Officer, Chief Technology Officer or Head of IT, and a Chief
            Information Security Officer or Head of Information Security [1](#d3bc5a1a-f3d5-5ecf-b3ce-70d616be9855)
            , with the requisite expertise and experience, are appointed. The appointments
            should be minimally approved by the Chief Executive Officer.
        links:
        - href: '#d3bc5a1a-f3d5-5ecf-b3ce-70d616be9855'
          rel: reference
          text: Footnote 1
      - id: trmg-3.1.4
        class: trmg-guideline
        title: TRMG 3.1.4
        props:
        - name: label
          value: 3.1.4
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.4_smt
          name: statement
          prose: The board of directors and senior management should ensure a technology
            risk management strategy is established and implemented.
      - id: trmg-3.1.5
        class: trmg-guideline
        title: TRMG 3.1.5
        props:
        - name: label
          value: 3.1.5
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.5_smt
          name: statement
          prose: The board of directors and senior management should ensure key IT
            decisions are made in accordance with the FI’s risk appetite.
      - id: trmg-3.1.6
        class: trmg-guideline
        title: TRMG 3.1.6
        props:
        - name: label
          value: 3.1.6
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.6_smt
          name: statement
          prose: Given that technology underpins many of the operations and services
            offered by an FI, the board of directors and senior management should
            set the tone from the top and cultivate a strong culture of technology
            risk awareness and management at all levels of staff within the FI.
      - id: trmg-3.1.7
        class: trmg-guideline
        title: TRMG 3.1.7
        props:
        - name: label
          value: 3.1.7
        - name: source-page
          value: '8'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.7_smt
          name: statement
          prose: 'The board of directors or a committee delegated by it, is responsible
            for: ensuring a sound and robust risk management framework is established
            and maintained to manage technology risks; ensuring there is a technology
            risk management function to oversee the technology risk management framework
            and strategy, as well as to provide an independent view of the technology
            risks faced by the FI; giving senior executives, who are responsible for
            executing the FI’s technology risk management strategy, sufficient authority,
            resources and access to the board of directors; approving the risk appetite
            and risk tolerance statement that articulates the nature and extent of
            technology risks that the FI is willing and able to assume; undertaking
            regular reviews of the technology risk management strategy for continued
            relevance; assessing management competencies for managing technology risks;
            and ensuring an independent audit function is established to assess the
            effectiveness of controls, risk management and governance of the FI.'
      - id: trmg-3.1.8
        class: trmg-guideline
        title: TRMG 3.1.8
        props:
        - name: label
          value: 3.1.8
        - name: source-page
          value: '8'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.1.8_smt
          name: statement
          prose: 'Senior management is responsible for: establishing the technology
            risk management framework and strategy; managing technology risks based
            on the established framework and strategy; ensuring sound and prudent
            policies, standards and procedures for managing technology risks are established
            and maintained, and that standards and procedures are implemented effectively;
            ensuring the roles and responsibilities [2](#ce400bfb-fea2-5c76-b11e-a32c434953aa)
            of staff in managing technology risks are delineated clearly; and apprising
            the board of directors of salient and adverse technology risk developments
            and incidents that are likely to have a major impact on the FI in a timely
            manner.'
        links:
        - href: '#ce400bfb-fea2-5c76-b11e-a32c434953aa'
          rel: reference
          text: Footnote 2
    - id: trmg-g-3.2
      class: trmg-section
      title: Policies, Standards and Procedures
      props:
      - name: label
        value: '3.2'
      controls:
      - id: trmg-3.2.1
        class: trmg-guideline
        title: TRMG 3.2.1
        props:
        - name: label
          value: 3.2.1
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.2.1_smt
          name: statement
          prose: The FI should establish policies, standards and procedures and, where
            appropriate, incorporate industry standards and best practices to manage
            technology risks and safeguard information assets [3](#fa87dda3-3967-5b5a-a224-f189f9115764)
            in the FI. The policies, standards and procedures should also be regularly
            reviewed and updated, taking into consideration the evolving technology
            and cyber threat landscape.
        links:
        - href: '#fa87dda3-3967-5b5a-a224-f189f9115764'
          rel: reference
          text: Footnote 3
      - id: trmg-3.2.2
        class: trmg-guideline
        title: TRMG 3.2.2
        props:
        - name: label
          value: 3.2.2
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.2.2_smt
          name: statement
          prose: The FI should ensure risks associated with deviations are thoroughly
            reviewed and assessed. The risk assessment should be approved by senior
            management. Approved deviations should be reviewed periodically to ensure
            the residual risks remain at an acceptable level.
      - id: trmg-3.2.3
        class: trmg-guideline
        title: TRMG 3.2.3
        props:
        - name: label
          value: 3.2.3
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.2.3_smt
          name: statement
          prose: Compliance processes should be implemented to verify that policies,
            standards and procedures are adhered to. These include follow-up processes
            for non-compliance.
    - id: trmg-g-3.3
      class: trmg-section
      title: Management of Information Assets
      props:
      - name: label
        value: '3.3'
      controls:
      - id: trmg-3.3.1
        class: trmg-guideline
        title: TRMG 3.3.1
        props:
        - name: label
          value: 3.3.1
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.3.1_smt
          name: statement
          prose: 'To have an accurate and complete view of its IT operating environment,
            the FI should establish information asset management practices that include
            the following: identification of information assets that support the FI’s
            business and delivery of financial services; classification of an information
            asset based on its security classification or criticality; ownership of
            information assets, and the roles and responsibilities of the staff managing
            the information assets; and establishment of policies, standards and procedures
            to manage information assets according to their security classification
            or criticality.'
      - id: trmg-3.3.2
        class: trmg-guideline
        title: TRMG 3.3.2
        props:
        - name: label
          value: 3.3.2
        - name: source-page
          value: '10'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.3.2_smt
          name: statement
          prose: The FI should maintain an inventory of all its information assets.
            The inventory should be reviewed periodically and updated whenever there
            are changes.
    - id: trmg-g-3.4
      class: trmg-section
      title: Management of Third Party Services
      props:
      - name: label
        value: '3.4'
      controls:
      - id: trmg-3.4.1
        class: trmg-guideline
        title: TRMG 3.4.1
        props:
        - name: label
          value: 3.4.1
        - name: source-page
          value: '10'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.4.1_smt
          name: statement
          prose: The use of certain third party services by FIs may not always constitute
            outsourcing. However, as many of these services are provisioned or delivered
            using IT, or may involve confidential or sensitive customer information
            being stored or processed electronically by the third party, the FI’s
            operations and its customers may be adversely impacted if there is a system
            failure or security breach at the third party.
      - id: trmg-3.4.2
        class: trmg-guideline
        title: TRMG 3.4.2
        props:
        - name: label
          value: 3.4.2
        - name: source-page
          value: '10'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.4.2_smt
          name: statement
          prose: The FI should assess and manage its exposure to technology risks
            that may affect the confidentiality, integrity and availability of the
            IT systems and data at the third party before entering into a contractual
            agreement or partnership.
      - id: trmg-3.4.3
        class: trmg-guideline
        title: TRMG 3.4.3
        props:
        - name: label
          value: 3.4.3
        - name: source-page
          value: '10'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.4.3_smt
          name: statement
          prose: On an ongoing basis, the FI should ensure the third party employs
            a high standard of care and diligence in protecting data confidentiality
            [4](#483f5682-c44d-5fcd-be53-d4171c21dabf) and integrity as well as ensuring
            system resilience.
        links:
        - href: '#483f5682-c44d-5fcd-be53-d4171c21dabf'
          rel: reference
          text: Footnote 4
    - id: trmg-g-3.5
      class: trmg-section
      title: Competency and Background Review
      props:
      - name: label
        value: '3.5'
      controls:
      - id: trmg-3.5.1
        class: trmg-guideline
        title: TRMG 3.5.1
        props:
        - name: label
          value: 3.5.1
        - name: source-page
          value: '10'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.5.1_smt
          name: statement
          prose: As the human element plays an important role in managing IT systems
            and processes in an IT environment, the FI should ensure personnel, including
            contractors and service providers, have the requisite level of competence
            and skills to perform the IT functions and manage technology risks.
      - id: trmg-3.5.2
        class: trmg-guideline
        title: TRMG 3.5.2
        props:
        - name: label
          value: 3.5.2
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.5.2_smt
          name: statement
          prose: Insider threat, which includes theft of confidential data, sabotage
            of IT systems and fraud by staff, contractors and service providers, is
            considered one of the risks to an organisation. A background check on
            personnel, who has access to the FI’s data and IT systems, should be performed
            to minimise this risk.
    - id: trmg-g-3.6
      class: trmg-section
      title: Security Awareness and Training
      props:
      - name: label
        value: '3.6'
      controls:
      - id: trmg-3.6.1
        class: trmg-guideline
        title: TRMG 3.6.1
        props:
        - name: label
          value: 3.6.1
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.6.1_smt
          name: statement
          prose: A comprehensive IT security awareness training programme should be
            established to maintain a high level of awareness among all staff in the
            FI. The content of the training programme should minimally include information
            on the prevailing cyber threat landscape and its implications, the FI’s
            IT security policies and standards, as well as an individual’s responsibility
            to safeguard information assets. All personnel in the FI should be made
            aware of the applicable laws, regulations, and guidelines pertaining to
            the use of, and access to, information assets.
      - id: trmg-3.6.2
        class: trmg-guideline
        title: TRMG 3.6.2
        props:
        - name: label
          value: 3.6.2
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.6.2_smt
          name: statement
          prose: The training programme should be conducted at least annually for
            all staff, contractors and service providers who have access to the FI’s
            information assets.
      - id: trmg-3.6.3
        class: trmg-guideline
        title: TRMG 3.6.3
        props:
        - name: label
          value: 3.6.3
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.6.3_smt
          name: statement
          prose: The board of directors should undergo training to raise their awareness
            on risks associated with the use of technology and enhance their understanding
            of technology risk management practices.
      - id: trmg-3.6.4
        class: trmg-guideline
        title: TRMG 3.6.4
        props:
        - name: label
          value: 3.6.4
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-3.6.4_smt
          name: statement
          prose: The training programme should be reviewed periodically to ensure
            its contents remain current and relevant. The review should take into
            consideration changes in the FI’s IT security policies, prevalent and
            emerging risks, and the evolving cyber threat landscape.
  - id: trmg-g-4
    class: trmg-chapter
    title: Technology Risk Management Framework
    props:
    - name: label
      value: '4'
    groups:
    - id: trmg-g-4.1
      class: trmg-section
      title: Risk Management Framework
      props:
      - name: label
        value: '4.1'
      controls:
      - id: trmg-4.1.1
        class: trmg-guideline
        title: TRMG 4.1.1
        props:
        - name: label
          value: 4.1.1
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.1.1_smt
          name: statement
          prose: The FI should establish a risk management framework to manage technology
            risks. Appropriate governance structures and processes should be established,
            with well- defined roles, responsibilities, and clear reporting lines
            across the various organisational functions.
      - id: trmg-4.1.2
        class: trmg-guideline
        title: TRMG 4.1.2
        props:
        - name: label
          value: 4.1.2
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.1.2_smt
          name: statement
          prose: Effective risk management practices and internal controls should
            be instituted to achieve data confidentiality and integrity, system security
            and reliability, as well as stability and resilience in its IT operating
            environment.
      - id: trmg-4.1.3
        class: trmg-guideline
        title: TRMG 4.1.3
        props:
        - name: label
          value: 4.1.3
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.1.3_smt
          name: statement
          prose: The risk owner, who is accountable for ensuring proper risk treatment
            measures are implemented and enforced for a specific technology risk,
            should be identified. The role of the risk owner may be assumed by a function
            or group of functions within the FI, who is given the authority to manage
            technology risks.
      - id: trmg-4.1.4
        class: trmg-guideline
        title: TRMG 4.1.4
        props:
        - name: label
          value: 4.1.4
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.1.4_smt
          name: statement
          prose: 'The framework should also encompass the following components: risk
            identification – identify threats and vulnerabilities to the FI and information
            assets; risk assessment – assess the potential impact and likelihood of
            threats and vulnerabilities to the FI and information assets; risk treatment
            – implement processes and controls to manage technology risks posed to
            the FI and protect the confidentiality, integrity and availability of
            information assets; and risk monitoring, review and reporting – monitor
            and review technology risks, which include risks that customers are exposed
            to, changes in business strategy, IT systems, environmental or operating
            conditions; and report key risks to the board of directors and senior
            management.'
      - id: trmg-4.1.5
        class: trmg-guideline
        title: TRMG 4.1.5
        props:
        - name: label
          value: 4.1.5
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.1.5_smt
          name: statement
          prose: As business and IT environments, as well as the cyber threat landscape,
            tend to evolve over time, the FI should review the adequacy and effectiveness
            of its risk management framework regularly.
    - id: trmg-g-4.2
      class: trmg-section
      title: Risk Identification
      props:
      - name: label
        value: '4.2'
      controls:
      - id: trmg-4.2.1
        class: trmg-guideline
        title: TRMG 4.2.1
        props:
        - name: label
          value: 4.2.1
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.2.1_smt
          name: statement
          prose: The FI should identify the threats and vulnerabilities applicable
            to its IT environment, including information assets that are maintained
            or supported by third party service providers. Examples of security threats
            that could have a severe impact on the FI and its stakeholders include
            internal sabotage, malware and data theft.
    - id: trmg-g-4.3
      class: trmg-section
      title: Risk Assessment
      props:
      - name: label
        value: '4.3'
      controls:
      - id: trmg-4.3.1
        class: trmg-guideline
        title: TRMG 4.3.1
        props:
        - name: label
          value: 4.3.1
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.3.1_smt
          name: statement
          prose: The FI should perform an analysis of the potential impact and consequences
            of the threats and vulnerabilities on the overall business and operations.
            The FI should take into consideration financial, operational, legal, reputational
            and regulatory factors in assessing technology risks.
      - id: trmg-4.3.2
        class: trmg-guideline
        title: TRMG 4.3.2
        props:
        - name: label
          value: 4.3.2
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.3.2_smt
          name: statement
          prose: To facilitate the prioritisation of technology risks, a set of criteria
            measuring and determining the likelihood and impact of the risk scenarios
            should be established.
    - id: trmg-g-4.4
      class: trmg-section
      title: Risk Treatment
      props:
      - name: label
        value: '4.4'
      controls:
      - id: trmg-4.4.1
        class: trmg-guideline
        title: TRMG 4.4.1
        props:
        - name: label
          value: 4.4.1
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.4.1_smt
          name: statement
          prose: The FI should develop and implement risk mitigation and control measures
            that are consistent with the criticality of the information assets and
            the level of risk tolerance. The IT control and risk mitigation approach
            should be subject to regular review and update, taking into account the
            changing threat landscape and variations in the FI’s risk profile.
      - id: trmg-4.4.2
        class: trmg-guideline
        title: TRMG 4.4.2
        props:
        - name: label
          value: 4.4.2
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.4.2_smt
          name: statement
          prose: As there are residual risks from threats and vulnerabilities which
            cannot be fully eliminated, the FI should assess whether risks have been
            reduced to an acceptable level after applying the mitigating measures.
            The criteria and approving authorities for risk acceptance should be clearly
            defined and it should be commensurate with the FI’s risk tolerance.
      - id: trmg-4.4.3
        class: trmg-guideline
        title: TRMG 4.4.3
        props:
        - name: label
          value: 4.4.3
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.4.3_smt
          name: statement
          prose: The FI should take insurance cover for various insurable technology
            risks to reduce financial impact such as recovery and restitution costs.
    - id: trmg-g-4.5
      class: trmg-section
      title: Risk Monitoring, Review and Reporting
      props:
      - name: label
        value: '4.5'
      controls:
      - id: trmg-4.5.1
        class: trmg-guideline
        title: TRMG 4.5.1
        props:
        - name: label
          value: 4.5.1
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.5.1_smt
          name: statement
          prose: The FI should institute a process for assessing and monitoring the
            design and operating effectiveness of IT controls against identified risks.
      - id: trmg-4.5.2
        class: trmg-guideline
        title: TRMG 4.5.2
        props:
        - name: label
          value: 4.5.2
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.5.2_smt
          name: statement
          prose: A risk register should be maintained to facilitate the monitoring
            and reporting of technology risks. Significant risks should be monitored
            closely and reported to the board of directors and senior management.
            The frequency of monitoring and reporting should be commensurate with
            the level of risk.
      - id: trmg-4.5.3
        class: trmg-guideline
        title: TRMG 4.5.3
        props:
        - name: label
          value: 4.5.3
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-4.5.3_smt
          name: statement
          prose: To facilitate risk reporting to management, technology risk metrics
            should be developed to highlight information assets that have the highest
            risk exposure. In determining the technology risk metrics, the FI should
            take into account risk events and audit observations, as well as applicable
            regulatory requirements.
  - id: trmg-g-5
    class: trmg-chapter
    title: IT Project Management and Security-by-Design
    props:
    - name: label
      value: '5'
    groups:
    - id: trmg-g-5.1
      class: trmg-section
      title: Project Management Framework
      props:
      - name: label
        value: '5.1'
      controls:
      - id: trmg-5.1.1
        class: trmg-guideline
        title: TRMG 5.1.1
        props:
        - name: label
          value: 5.1.1
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.1.1_smt
          name: statement
          prose: A project management framework should be established to ensure consistency
            in project management practices, and delivery of outcomes that meets project
            objectives and requirements. The framework should cover the policies,
            standards, procedures, processes and activities to manage projects from
            initiation to closure.
      - id: trmg-5.1.2
        class: trmg-guideline
        title: TRMG 5.1.2
        props:
        - name: label
          value: 5.1.2
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.1.2_smt
          name: statement
          prose: Detailed IT project plans should be established for all IT projects.
            An IT project plan should set out the scope of the project, as well as
            the activities, milestones and the deliverables to be realised at each
            phase of the project. The roles and responsibilities of staff involved
            in the project should be clearly defined in the plan.
      - id: trmg-5.1.3
        class: trmg-guideline
        title: TRMG 5.1.3
        props:
        - name: label
          value: 5.1.3
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.1.3_smt
          name: statement
          prose: Key documentation in the IT project life cycle, including the feasibility
            analysis, cost-benefit analysis, business case analysis, project plan,
            as well as the implementation plan, should be maintained and approved
            by the relevant business and IT management.
      - id: trmg-5.1.4
        class: trmg-guideline
        title: TRMG 5.1.4
        props:
        - name: label
          value: 5.1.4
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.1.4_smt
          name: statement
          prose: As project risks can adversely impact the IT project delivery timeline,
            budget and quality of the project deliverables, a risk management process
            should be established to identify, assess, treat and monitor the attendant
            risks throughout the project life cycle.
    - id: trmg-g-5.2
      class: trmg-section
      title: Project Steering Committee
      props:
      - name: label
        value: '5.2'
      controls:
      - id: trmg-5.2.1
        class: trmg-guideline
        title: TRMG 5.2.1
        props:
        - name: label
          value: 5.2.1
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.2.1_smt
          name: statement
          prose: For large and complex projects that impact the business, a project
            steering committee consisting of key stakeholders, including business
            owners and IT, should be formed to provide direction, guidance and oversight
            to ensure milestones are reached, and deliverables are realised in a timely
            manner.
      - id: trmg-5.2.2
        class: trmg-guideline
        title: TRMG 5.2.2
        props:
        - name: label
          value: 5.2.2
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.2.2_smt
          name: statement
          prose: Risks and issues for large and complex projects, which cannot be
            resolved at the project management level, should be escalated to the project
            steering committee and senior management.
    - id: trmg-g-5.3
      class: trmg-section
      title: System Acquisition
      props:
      - name: label
        value: '5.3'
      controls:
      - id: trmg-5.3.1
        class: trmg-guideline
        title: TRMG 5.3.1
        props:
        - name: label
          value: 5.3.1
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.3.1_smt
          name: statement
          prose: The FI should establish standards and procedures for vendor evaluation
            and selection to ensure the selected vendor is qualified and able to meet
            its project requirements and deliverables. The level of assessment and
            due diligence performed should be commensurate with the criticality of
            the project deliverables to the FI.
      - id: trmg-5.3.2
        class: trmg-guideline
        title: TRMG 5.3.2
        props:
        - name: label
          value: 5.3.2
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.3.2_smt
          name: statement
          prose: It is important that the FI assesses the robustness of the vendor’s
            software development and quality assurance practices, and ensures stringent
            security practices are in place to safeguard and protect any sensitive
            data the vendor has access to over the course of the project. Any vendor
            access to the FI’s IT systems should be controlled and monitored.
      - id: trmg-5.3.3
        class: trmg-guideline
        title: TRMG 5.3.3
        props:
        - name: label
          value: 5.3.3
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.3.3_smt
          name: statement
          prose: If a project involves a commercial off-the-shelf (COTS) solution
            that does not meet the FI’s security requirements, the FI should assess
            the risks and ensure adequate mitigating controls are implemented to address
            the risks before the solution is deployed.
      - id: trmg-5.3.4
        class: trmg-guideline
        title: TRMG 5.3.4
        props:
        - name: label
          value: 5.3.4
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.3.4_smt
          name: statement
          prose: The FI should assess if a source code escrow agreement should be
            in place, based on the criticality of the acquired software to the FI’s
            business, so that the FI can have access to the source code in the event
            that the vendor is unable to support the FI. Suitable alternatives to
            replace the software should be identified if an escrow agreement could
            not be implemented.
    - id: trmg-g-5.4
      class: trmg-section
      title: System Development Life Cycle and Security-By-Design
      props:
      - name: label
        value: '5.4'
      controls:
      - id: trmg-5.4.1
        class: trmg-guideline
        title: TRMG 5.4.1
        props:
        - name: label
          value: 5.4.1
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.4.1_smt
          name: statement
          prose: The FI should establish a framework to manage its system development
            life cycle (SDLC). [5](#2a5747f6-a20d-5e24-8ff2-b4a406723073) The framework
            [6](#3ce9b810-4958-52f8-a09d-2d27ad5124cd) should clearly define the processes,
            procedures and controls in each phase of the life cycle, such as initiation/planning,
            requirements analysis, design, implementation, testing and acceptance.
            Standards and procedures for the different phases of the SDLC should be
            maintained.
        links:
        - href: '#2a5747f6-a20d-5e24-8ff2-b4a406723073'
          rel: reference
          text: Footnote 5
        - href: '#3ce9b810-4958-52f8-a09d-2d27ad5124cd'
          rel: reference
          text: Footnote 6
      - id: trmg-5.4.2
        class: trmg-guideline
        title: TRMG 5.4.2
        props:
        - name: label
          value: 5.4.2
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.4.2_smt
          name: statement
          prose: The security-by-design approach refers to building security in every
            phase of the SDLC in order to minimise system vulnerabilities and reduce
            the attack surface. The FI should incorporate security specifications
            in the system design, perform continuous security evaluation, and adhere
            to security practices throughout the SDLC.
      - id: trmg-5.4.3
        class: trmg-guideline
        title: TRMG 5.4.3
        props:
        - name: label
          value: 5.4.3
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.4.3_smt
          name: statement
          prose: Security requirements should minimally cover key control areas such
            as access control, authentication, authorisation, data integrity and confidentiality,
            system activity logging, security event tracking and exception handling.
      - id: trmg-5.4.4
        class: trmg-guideline
        title: TRMG 5.4.4
        props:
        - name: label
          value: 5.4.4
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.4.4_smt
          name: statement
          prose: The SDLC should, where relevant, involve the IT security function
            in each phase of the life cycle.
    - id: trmg-g-5.5
      class: trmg-section
      title: System Requirements Analysis
      props:
      - name: label
        value: '5.5'
      controls:
      - id: trmg-5.5.1
        class: trmg-guideline
        title: TRMG 5.5.1
        props:
        - name: label
          value: 5.5.1
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.5.1_smt
          name: statement
          prose: The FI should identify, define and document the functional requirements
            for the IT system. In addition to functional requirements, key requirements
            such as system performance, resilience and security controls, should also
            be established and documented.
      - id: trmg-5.5.2
        class: trmg-guideline
        title: TRMG 5.5.2
        props:
        - name: label
          value: 5.5.2
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.5.2_smt
          name: statement
          prose: In establishing the security requirements, the FI should assess the
            potential threats and risks related to the IT system, and determine the
            acceptable level of security required to meet its business needs.
    - id: trmg-g-5.6
      class: trmg-section
      title: System Design and Implementation
      props:
      - name: label
        value: '5.6'
      controls:
      - id: trmg-5.6.1
        class: trmg-guideline
        title: TRMG 5.6.1
        props:
        - name: label
          value: 5.6.1
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.6.1_smt
          name: statement
          prose: As part of the design phase, the FI should review the proposed architecture
            and design of the IT system, including the IT controls to be built into
            the system, to ensure they meet the defined requirements, before implementation.
      - id: trmg-5.6.2
        class: trmg-guideline
        title: TRMG 5.6.2
        props:
        - name: label
          value: 5.6.2
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.6.2_smt
          name: statement
          prose: The FI should verify that system requirements are met by the current
            system design and implementation. Any changes to, or deviations from,
            the defined requirements should be endorsed by relevant stakeholders.
      - id: trmg-5.6.3
        class: trmg-guideline
        title: TRMG 5.6.3
        props:
        - name: label
          value: 5.6.3
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.6.3_smt
          name: statement
          prose: Relevant domain experts should be engaged to participate in the design
            review. For example, the security design and architecture of the IT system
            should be reviewed by IT security specialists or qualified security consultants.
    - id: trmg-g-5.7
      class: trmg-section
      title: System Testing and Acceptance
      props:
      - name: label
        value: '5.7'
      controls:
      - id: trmg-5.7.1
        class: trmg-guideline
        title: TRMG 5.7.1
        props:
        - name: label
          value: 5.7.1
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.7.1_smt
          name: statement
          prose: A methodology for system testing [7](#1d046468-5b24-51d5-aebf-feaa77d64030)
            should be established. The scope of testing should cover business logic,
            system function, security controls and system performance under various
            load and stress conditions. A test plan should be established and approved
            before testing.
        links:
        - href: '#1d046468-5b24-51d5-aebf-feaa77d64030'
          rel: reference
          text: Footnote 7
      - id: trmg-5.7.2
        class: trmg-guideline
        title: TRMG 5.7.2
        props:
        - name: label
          value: 5.7.2
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.7.2_smt
          name: statement
          prose: The FI should trace the requirements during the testing phase, and
            ensure each requirement is covered by appropriate test cases.
      - id: trmg-5.7.3
        class: trmg-guideline
        title: TRMG 5.7.3
        props:
        - name: label
          value: 5.7.3
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.7.3_smt
          name: statement
          prose: The FI should maintain separate physical or logical environments
            for unit, system integration and user acceptance testing, and restrict
            access to each environment on a need-to basis.
      - id: trmg-5.7.4
        class: trmg-guideline
        title: TRMG 5.7.4
        props:
        - name: label
          value: 5.7.4
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.7.4_smt
          name: statement
          prose: The FI should perform regression testing for changes (e.g. enhancement,
            rectification, etc.) to an existing IT system to validate that it continues
            to function properly after the changes have been implemented.
      - id: trmg-5.7.5
        class: trmg-guideline
        title: TRMG 5.7.5
        props:
        - name: label
          value: 5.7.5
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.7.5_smt
          name: statement
          prose: Issues identified from testing, including system defects or software
            bugs, should be properly tracked and addressed. Major issues that could
            have an adverse impact on the FI’s operations or delivery of service to
            customers should be reported to the project steering committee and addressed
            prior to deployment to the production environment.
      - id: trmg-5.7.6
        class: trmg-guideline
        title: TRMG 5.7.6
        props:
        - name: label
          value: 5.7.6
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.7.6_smt
          name: statement
          prose: The FI should ensure the results of all testing that was conducted
            are documented in the test report, and signed off by the relevant stakeholders.
    - id: trmg-g-5.8
      class: trmg-section
      title: Quality Management
      props:
      - name: label
        value: '5.8'
      controls:
      - id: trmg-5.8.1
        class: trmg-guideline
        title: TRMG 5.8.1
        props:
        - name: label
          value: 5.8.1
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.8.1_smt
          name: statement
          prose: During project planning, the FI should define the expected quality
            attributes and the assessment metrics for the project deliverables based
            on its quality control standards.
      - id: trmg-5.8.2
        class: trmg-guideline
        title: TRMG 5.8.2
        props:
        - name: label
          value: 5.8.2
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-5.8.2_smt
          name: statement
          prose: Quality assurance should be performed by an independent quality assurance
            function to ensure project activities and deliverables comply with the
            FI’s policies, procedures and standards.
  - id: trmg-g-6
    class: trmg-chapter
    title: Software Application Development and Management
    props:
    - name: label
      value: '6'
    groups:
    - id: trmg-g-6.1
      class: trmg-section
      title: Secure Coding, Source Code Review and Application Security Testing
      props:
      - name: label
        value: '6.1'
      controls:
      - id: trmg-6.1.1
        class: trmg-guideline
        title: TRMG 6.1.1
        props:
        - name: label
          value: 6.1.1
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.1_smt
          name: statement
          prose: Software bugs or vulnerabilities are typically targeted and exploited
            by threat actors to compromise an IT system, and they often occur because
            of poor software development practices. To minimise the bugs and vulnerabilities
            in its software, the FI should adopt standards on secure coding, source
            code review [8](#af397051-4c2b-5469-ae65-a1b70ed9e80e) and application
            security testing.
        links:
        - href: '#af397051-4c2b-5469-ae65-a1b70ed9e80e'
          rel: reference
          text: Footnote 8
      - id: trmg-6.1.2
        class: trmg-guideline
        title: TRMG 6.1.2
        props:
        - name: label
          value: 6.1.2
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.2_smt
          name: statement
          prose: The secure coding and source code review standards should cover areas
            such as secure programming practices, input validation, output encoding,
            access controls, authentication, cryptographic practices, and error and
            exception handling.
      - id: trmg-6.1.3
        class: trmg-guideline
        title: TRMG 6.1.3
        props:
        - name: label
          value: 6.1.3
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.3_smt
          name: statement
          prose: A policy and procedure on the use of third party and open-source
            software codes should be established to ensure these codes are subject
            to review and testing before they are integrated into the FI’s software.
      - id: trmg-6.1.4
        class: trmg-guideline
        title: TRMG 6.1.4
        props:
        - name: label
          value: 6.1.4
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.4_smt
          name: statement
          prose: To facilitate the remediation of vulnerabilities in a timely manner,
            the FI should keep track of updates and reported vulnerabilities for third
            party and open-source software codes that are incorporated in the FI’s
            software.
      - id: trmg-6.1.5
        class: trmg-guideline
        title: TRMG 6.1.5
        props:
        - name: label
          value: 6.1.5
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.5_smt
          name: statement
          prose: The FI should ensure its software developers are trained or have
            the necessary knowledge and skills to apply the secure coding and application
            security standards when developing applications.
      - id: trmg-6.1.6
        class: trmg-guideline
        title: TRMG 6.1.6
        props:
        - name: label
          value: 6.1.6
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.6_smt
          name: statement
          prose: It is essential for the FI to establish a comprehensive strategy
            to perform application security validation and testing. The FI may use
            a mixture of static, dynamic and interactive application security testing
            methods (refer to Annex A on Application Security Testing) to validate
            the security of the software application. The software validation and
            testing rules should be reviewed periodically and kept current.
      - id: trmg-6.1.7
        class: trmg-guideline
        title: TRMG 6.1.7
        props:
        - name: label
          value: 6.1.7
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.1.7_smt
          name: statement
          prose: All issues and software defects discovered from the source code review
            and application security testing should be tracked. Major issues and software
            defects should be remediated before production deployment.
    - id: trmg-g-6.2
      class: trmg-section
      title: Agile Software Development
      props:
      - name: label
        value: '6.2'
      controls:
      - id: trmg-6.2.1
        class: trmg-guideline
        title: TRMG 6.2.1
        props:
        - name: label
          value: 6.2.1
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.2.1_smt
          name: statement
          prose: Agile software development is based on an iterative and incremental
            development model to accelerate software development and delivery to respond
            to business and customer needs. When adopting Agile software development
            methods, the FI should continue to incorporate the necessary SDLC and
            security-by-design principles throughout its Agile process.
      - id: trmg-6.2.2
        class: trmg-guideline
        title: TRMG 6.2.2
        props:
        - name: label
          value: 6.2.2
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.2.2_smt
          name: statement
          prose: The FI should ensure secure coding, source code review and application
            security testing standards are applied during Agile software development.
    - id: trmg-g-6.3
      class: trmg-section
      title: DevSecOps Management
      props:
      - name: label
        value: '6.3'
      controls:
      - id: trmg-6.3.1
        class: trmg-guideline
        title: TRMG 6.3.1
        props:
        - name: label
          value: 6.3.1
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.3.1_smt
          name: statement
          prose: DevSecOps is the practice of automating and integrating IT operations,
            quality assurance and security practices in the software development process.
            It constitutes continuous integration, continuous delivery and IT security
            practices for frequent, efficient, reliable and secure development, testing
            and release of software products. The FI should ensure its DevSecOps activities
            and processes are aligned with its SDLC framework and IT service management
            processes (e.g. configuration management, change management, software
            release management).
      - id: trmg-6.3.2
        class: trmg-guideline
        title: TRMG 6.3.2
        props:
        - name: label
          value: 6.3.2
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.3.2_smt
          name: statement
          prose: The FI should implement adequate security measures and enforce segregation
            of duties for the software development, testing and release functions
            in its DevSecOps processes.
    - id: trmg-g-6.4
      class: trmg-section
      title: Application Programming Interface Development
      props:
      - name: label
        value: '6.4'
      controls:
      - id: trmg-6.4.1
        class: trmg-guideline
        title: TRMG 6.4.1
        props:
        - name: label
          value: 6.4.1
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.1_smt
          name: statement
          prose: Application programming interfaces (APIs) [9](#9d01d8c8-d33c-5af8-a7fb-a8e8cb826e1b)
            enable various software applications to communicate and interact with
            each other and exchange data. Open APIs are publicly available APIs that
            provide developers with programmatic access to a software application
            or web service. FIs may collaborate with FinTech companies and develop
            open APIs, which are used by third parties to implement products and services
            for customers and the marketplace. Hence, it is important for the FI to
            establish adequate safeguards to manage the development and provisioning
            of APIs for secure delivery of such services.
        links:
        - href: '#9d01d8c8-d33c-5af8-a7fb-a8e8cb826e1b'
          rel: reference
          text: Footnote 9
      - id: trmg-6.4.2
        class: trmg-guideline
        title: TRMG 6.4.2
        props:
        - name: label
          value: 6.4.2
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.2_smt
          name: statement
          prose: A well-defined vetting process should be implemented for assessing
            third parties’ suitability in connecting to the FI via APIs, as well as
            governing third party API access. The vetting criteria should take into
            account factors such as the third party’s nature of business, cyber security
            posture, industry reputation and track record.
      - id: trmg-6.4.3
        class: trmg-guideline
        title: TRMG 6.4.3
        props:
        - name: label
          value: 6.4.3
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.3_smt
          name: statement
          prose: The FI should perform a risk assessment before allowing third parties
            to connect to its IT systems via APIs, and ensure the implementation for
            each API is commensurate with the sensitivity and business criticality
            of the data being exchanged, and the confidentiality and integrity requirements
            of the data.
      - id: trmg-6.4.4
        class: trmg-guideline
        title: TRMG 6.4.4
        props:
        - name: label
          value: 6.4.4
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.4_smt
          name: statement
          prose: Security standards for designing and developing secure APIs should
            be established. The standards should include the measures to protect the
            API keys or access tokens, [10](#2bd2e272-32dd-5b1e-bb73-fcfa65f50c11)
            which are used to authorise access to APIs to exchange confidential data.
            A reasonable timeframe should be defined and enforced for access token
            expiry to reduce the risk of unauthorised access.
        links:
        - href: '#2bd2e272-32dd-5b1e-bb73-fcfa65f50c11'
          rel: reference
          text: Footnote 10
      - id: trmg-6.4.5
        class: trmg-guideline
        title: TRMG 6.4.5
        props:
        - name: label
          value: 6.4.5
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.5_smt
          name: statement
          prose: Strong encryption standards and key management controls should be
            adopted to secure transmission of sensitive data through APIs.
      - id: trmg-6.4.6
        class: trmg-guideline
        title: TRMG 6.4.6
        props:
        - name: label
          value: 6.4.6
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.6_smt
          name: statement
          prose: A robust security screening and testing of the API should be performed
            between the FI and its third parties before it is deployed into production.
            The FI should log the access sessions by third parties, such as the identity
            of the party making the API connections, date and time, as well as the
            data being accessed.
      - id: trmg-6.4.7
        class: trmg-guideline
        title: TRMG 6.4.7
        props:
        - name: label
          value: 6.4.7
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.7_smt
          name: statement
          prose: Detective measures, such as technologies that provide real-time monitoring
            and alerting, should be instituted to provide visibility of the usage
            and performance of APIs, and detect suspicious activities. Robust measures
            should be established to promptly revoke the API keys or access token
            in the event of a breach.
      - id: trmg-6.4.8
        class: trmg-guideline
        title: TRMG 6.4.8
        props:
        - name: label
          value: 6.4.8
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.4.8_smt
          name: statement
          prose: The FI should ensure adequate system capacity is in place to handle
            high volumes of API call requests, and implement measures to mitigate
            cyber threats such as denial of service (DoS) attacks.
    - id: trmg-g-6.5
      class: trmg-section
      title: Management of End User Computing and Applications
      props:
      - name: label
        value: '6.5'
      controls:
      - id: trmg-6.5.1
        class: trmg-guideline
        title: TRMG 6.5.1
        props:
        - name: label
          value: 6.5.1
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.5.1_smt
          name: statement
          prose: The prevalence of business application tools and software on the
            Internet has enabled end user computing, where business users develop
            or use simple applications to automate their operations, such as performing
            data analysis and generating reports. IT hardware, software and services
            that are not managed by the IT department (shadow IT) increase the FI’s
            exposure to risks such as leakage of sensitive data or malware infection.
            Shadow IT should be managed as part of the FI’s information assets.
      - id: trmg-6.5.2
        class: trmg-guideline
        title: TRMG 6.5.2
        props:
        - name: label
          value: 6.5.2
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.5.2_smt
          name: statement
          prose: The FI should establish measures to control and monitor the use of
            shadow IT in its environment.
      - id: trmg-6.5.3
        class: trmg-guideline
        title: TRMG 6.5.3
        props:
        - name: label
          value: 6.5.3
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-6.5.3_smt
          name: statement
          prose: A process should be established to assess the risk of end user developed
            or acquired applications to the FI, and ensure appropriate controls and
            security measures are implemented to address the identified risks, and
            approval is obtained before being used. The FI should ensure proper testing
            before the applications are deployed.
  - id: trmg-g-7
    class: trmg-chapter
    title: IT Service Management
    props:
    - name: label
      value: '7'
    groups:
    - id: trmg-g-7.1
      class: trmg-section
      title: IT Service Management Framework
      props:
      - name: label
        value: '7.1'
      controls:
      - id: trmg-7.1.1
        class: trmg-guideline
        title: TRMG 7.1.1
        props:
        - name: label
          value: 7.1.1
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.1.1_smt
          name: statement
          prose: A robust IT service management framework is essential for supporting
            IT services and operations, tracking information assets, managing changes,
            responding to incidents, as well as ensuring the stability of the production
            IT environment. The framework should comprise the governance structure,
            processes and procedures for IT service management activities including
            configuration management, technology refresh management, patch management,
            change management, software release management, incident management and
            problem management.
    - id: trmg-g-7.2
      class: trmg-section
      title: Configuration Management
      props:
      - name: label
        value: '7.2'
      controls:
      - id: trmg-7.2.1
        class: trmg-guideline
        title: TRMG 7.2.1
        props:
        - name: label
          value: 7.2.1
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.2.1_smt
          name: statement
          prose: Configuration management is the process of maintaining key information
            (e.g. model, version, specifications, etc.) about the configuration of
            the hardware and software that makes up each IT system. The FI should
            implement a configuration management process to maintain accurate information
            of its hardware and software to have visibility and effective control
            of its IT systems.
      - id: trmg-7.2.2
        class: trmg-guideline
        title: TRMG 7.2.2
        props:
        - name: label
          value: 7.2.2
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.2.2_smt
          name: statement
          prose: The FI should review and verify the configuration information of
            its hardware and software on a regular basis to ensure it is accurate
            and up-to-date.
    - id: trmg-g-7.3
      class: trmg-section
      title: Technology Refresh Management
      props:
      - name: label
        value: '7.3'
      controls:
      - id: trmg-7.3.1
        class: trmg-guideline
        title: TRMG 7.3.1
        props:
        - name: label
          value: 7.3.1
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.3.1_smt
          name: statement
          prose: The FI should avoid using outdated and unsupported hardware or software,
            which could increase its exposure to security and stability risks. The
            FI should closely monitor the hardware’s or software’s end-of-support
            (EOS) dates as service providers would typically cease the provision of
            patches, including those relating to security vulnerabilities that are
            found after the EOS date.
      - id: trmg-7.3.2
        class: trmg-guideline
        title: TRMG 7.3.2
        props:
        - name: label
          value: 7.3.2
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.3.2_smt
          name: statement
          prose: A technology refresh plan for the replacement of hardware and software
            should be developed before they reach EOS. A risk assessment for hardware
            and software approaching EOS date should be conducted to evaluate the
            risks of their continued use, and effective risk mitigation measures should
            be implemented.
      - id: trmg-7.3.3
        class: trmg-guideline
        title: TRMG 7.3.3
        props:
        - name: label
          value: 7.3.3
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.3.3_smt
          name: statement
          prose: The FI should obtain dispensation from its management for the continued
            use of outdated and unsupported hardware and software. The dispensation
            should be assigned a validity period that is commensurate with the identified
            risks and risk mitigation measures. The dispensation should be reviewed
            periodically to ensure the attendant risks remain at an acceptable level.
    - id: trmg-g-7.4
      class: trmg-section
      title: Patch Management
      props:
      - name: label
        value: '7.4'
      controls:
      - id: trmg-7.4.1
        class: trmg-guideline
        title: TRMG 7.4.1
        props:
        - name: label
          value: 7.4.1
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.4.1_smt
          name: statement
          prose: A patch management process should be established to ensure applicable
            functional and non-functional patches (e.g. fixes for security vulnerabilities
            and software bugs) are implemented within a timeframe that is commensurate
            with the criticality of the patches and the FI’s IT systems.
      - id: trmg-7.4.2
        class: trmg-guideline
        title: TRMG 7.4.2
        props:
        - name: label
          value: 7.4.2
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.4.2_smt
          name: statement
          prose: Patches should be tested before they are applied to the FI’s IT systems
            in the production environment to ensure compatibility with existing IT
            systems or they do not introduce problems to the IT environment.
    - id: trmg-g-7.5
      class: trmg-section
      title: Change Management
      props:
      - name: label
        value: '7.5'
      controls:
      - id: trmg-7.5.1
        class: trmg-guideline
        title: TRMG 7.5.1
        props:
        - name: label
          value: 7.5.1
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.1_smt
          name: statement
          prose: The FI should establish a change management process to ensure changes
            to information assets are assessed, tested, reviewed and approved before
            implementation.
      - id: trmg-7.5.2
        class: trmg-guideline
        title: TRMG 7.5.2
        props:
        - name: label
          value: 7.5.2
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.2_smt
          name: statement
          prose: A risk and impact analysis of the change to an information asset
            should be conducted before implementing the change. The analysis should
            cover factors such as security and implications of the change in relation
            to other information assets.
      - id: trmg-7.5.3
        class: trmg-guideline
        title: TRMG 7.5.3
        props:
        - name: label
          value: 7.5.3
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.3_smt
          name: statement
          prose: The FI should ensure all changes are adequately tested in the test
            environment. Test plans for changes should be developed and approved by
            the relevant business and IT management. Test results should be accepted
            and signed off before the changes are deployed to the production environment.
      - id: trmg-7.5.4
        class: trmg-guideline
        title: TRMG 7.5.4
        props:
        - name: label
          value: 7.5.4
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.4_smt
          name: statement
          prose: A change advisory board, comprising key stakeholders including business
            and IT management, should be formed to approve and prioritise the changes
            after considering the stability and security implications of the changes
            to the production environment.
      - id: trmg-7.5.5
        class: trmg-guideline
        title: TRMG 7.5.5
        props:
        - name: label
          value: 7.5.5
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.5_smt
          name: statement
          prose: The FI should perform a backup of the information asset prior to
            the change implementation, and establish a rollback plan to revert the
            information asset to the previous state if a problem arises during or
            after the change implementation.
      - id: trmg-7.5.6
        class: trmg-guideline
        title: TRMG 7.5.6
        props:
        - name: label
          value: 7.5.6
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.6_smt
          name: statement
          prose: Urgent or emergency changes, such as a high priority security patch
            for an IT system, are changes that need to be implemented expeditiously
            and may not be able to follow the standard change management process.
            To reduce the risk to the security and stability of the production environment,
            the FI should clearly define the procedures for assessing, approving and
            implementing emergency changes, as well as identify the authorisers or
            approvers for the changes.
      - id: trmg-7.5.7
        class: trmg-guideline
        title: TRMG 7.5.7
        props:
        - name: label
          value: 7.5.7
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.5.7_smt
          name: statement
          prose: Logs contain useful information which facilitates investigations
            and troubleshooting. As such, the FI should ensure the logging facility
            is enabled to record activities that are performed during the change process.
    - id: trmg-g-7.6
      class: trmg-section
      title: Software Release Management
      props:
      - name: label
        value: '7.6'
      controls:
      - id: trmg-7.6.1
        class: trmg-guideline
        title: TRMG 7.6.1
        props:
        - name: label
          value: 7.6.1
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.6.1_smt
          name: statement
          prose: Segregation of duties in the software release process should be practised
            to ensure no single individual has the ability to develop, compile and
            move software codes [11](#d79b92c1-889a-5885-ae3a-6ca9df7e5039) from one
            environment to another.
        links:
        - href: '#d79b92c1-889a-5885-ae3a-6ca9df7e5039'
          rel: reference
          text: Footnote 11
      - id: trmg-7.6.2
        class: trmg-guideline
        title: TRMG 7.6.2
        props:
        - name: label
          value: 7.6.2
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.6.2_smt
          name: statement
          prose: It is important that controls are implemented to maintain traceability
            and integrity for all software codes that are moved between IT environments.
    - id: trmg-g-7.7
      class: trmg-section
      title: Incident Management
      props:
      - name: label
        value: '7.7'
      controls:
      - id: trmg-7.7.1
        class: trmg-guideline
        title: TRMG 7.7.1
        props:
        - name: label
          value: 7.7.1
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.1_smt
          name: statement
          prose: An IT incident occurs when there is an unexpected disruption to the
            delivery of IT services or a security breach of an IT system, which compromises
            the confidentiality, integrity and availability of data or the IT system.
            The FI should establish an incident management framework with the objective
            of restoring an affected IT service or system to a secure and stable state,
            as quickly as possible, so as to minimise impact to the FI’s business
            and customers.
      - id: trmg-7.7.2
        class: trmg-guideline
        title: TRMG 7.7.2
        props:
        - name: label
          value: 7.7.2
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.2_smt
          name: statement
          prose: The FI should ensure sufficient resources are available to facilitate
            and support incident response and recovery. The FI may engage external
            assistance to augment its resources to facilitate and support incident
            response and recovery. For example, the FI can engage an incident response
            and security forensic company to support cyber attack investigation, and
            provide 24 by 7 incident response capability.
      - id: trmg-7.7.3
        class: trmg-guideline
        title: TRMG 7.7.3
        props:
        - name: label
          value: 7.7.3
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.3_smt
          name: statement
          prose: 'The incident management framework should minimally cover: the process
            and procedure for handling IT incidents, including cyber related incidents;
            [12](#16c08c33-b5ba-52b0-878f-b50d2d25177c) maintenance and protection
            of supporting evidence for the investigation and diagnosis of incidents;
            and the roles and responsibilities of staff and external parties involved
            in recording, analysis, escalation, decision-making, resolution and monitoring
            of incidents.'
        links:
        - href: '#16c08c33-b5ba-52b0-878f-b50d2d25177c'
          rel: reference
          text: Footnote 12
      - id: trmg-7.7.4
        class: trmg-guideline
        title: TRMG 7.7.4
        props:
        - name: label
          value: 7.7.4
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.4_smt
          name: statement
          prose: The FI should configure system events or alerts to provide an early
            indication of issues that may affect its IT systems’ performance and security.
            System events or alerts should be actively monitored so that prompt measures
            can be taken to address the issues early.
      - id: trmg-7.7.5
        class: trmg-guideline
        title: TRMG 7.7.5
        props:
        - name: label
          value: 7.7.5
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.5_smt
          name: statement
          prose: In some situations, a major incident may develop unfavourably into
            a crisis. The FI should regularly apprise its senior management of the
            status of major incidents so that decisions to mitigate the impact of
            the crisis can be made in a timely manner, such as activation of IT disaster
            recovery.
      - id: trmg-7.7.6
        class: trmg-guideline
        title: TRMG 7.7.6
        props:
        - name: label
          value: 7.7.6
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.6_smt
          name: statement
          prose: A communications plan that covers the process and procedures to apprise
            customers of impact on services, and to handle media or public queries
            should be maintained. The plan should also include identifying the spokespersons
            and subject matter experts to address the media or public queries as well
            as the communication channels to disseminate information.
      - id: trmg-7.7.7
        class: trmg-guideline
        title: TRMG 7.7.7
        props:
        - name: label
          value: 7.7.7
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.7.7_smt
          name: statement
          prose: It would be useful for the FI to provide timely updates to its customers
            on the progress of its incident management and the measures the FI is
            implementing to protect its customers and continue delivery of financial
            services. Where appropriate, the FI should advise its customers on actions
            that they should take to protect themselves.
    - id: trmg-g-7.8
      class: trmg-section
      title: Problem Management
      props:
      - name: label
        value: '7.8'
      controls:
      - id: trmg-7.8.1
        class: trmg-guideline
        title: TRMG 7.8.1
        props:
        - name: label
          value: 7.8.1
        - name: source-page
          value: '27'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.8.1_smt
          name: statement
          prose: The FI should establish problem management process and procedures
            to determine and resolve the root cause of incidents to prevent the recurrence
            of similar incidents.
      - id: trmg-7.8.2
        class: trmg-guideline
        title: TRMG 7.8.2
        props:
        - name: label
          value: 7.8.2
        - name: source-page
          value: '27'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.8.2_smt
          name: statement
          prose: The FI should maintain a record of past incidents which include lessons
            learnt to facilitate the diagnosis and resolution of future incidents
            with similar characteristics.
      - id: trmg-7.8.3
        class: trmg-guideline
        title: TRMG 7.8.3
        props:
        - name: label
          value: 7.8.3
        - name: source-page
          value: '27'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-7.8.3_smt
          name: statement
          prose: A trend analysis of past incidents should be performed by the FI
            to identify commonalities and patterns in the incidents, and verify if
            the root causes to the problems had been properly identified and resolved.
            The FI should also use the analysis to determine if further corrective
            or preventive measures are necessary.
  - id: trmg-g-8
    class: trmg-chapter
    title: IT Resilience
    props:
    - name: label
      value: '8'
    groups:
    - id: trmg-g-8.1
      class: trmg-section
      title: System Availability
      props:
      - name: label
        value: '8.1'
      controls:
      - id: trmg-8.1.1
        class: trmg-guideline
        title: TRMG 8.1.1
        props:
        - name: label
          value: 8.1.1
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.1.1_smt
          name: statement
          prose: Maintaining system availability is crucial in achieving confidence
            and trust in the FI’s operational capabilities. IT systems should be designed
            and implemented to achieve the level of system availability that is commensurate
            with its business needs.
      - id: trmg-8.1.2
        class: trmg-guideline
        title: TRMG 8.1.2
        props:
        - name: label
          value: 8.1.2
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.1.2_smt
          name: statement
          prose: Redundancy or fault-tolerant solutions should be implemented for
            IT systems which require high system availability. The FI should perform
            a periodic review of its IT system and network architecture design to
            identify weaknesses in the existing design. The review should include
            a mapping of internal and external dependencies of the FI’s IT systems
            to determine any single point of failure. It is important that the FI
            conducts regular testing to ascertain that the level of resilience continues
            to meet its business requirements.
      - id: trmg-8.1.3
        class: trmg-guideline
        title: TRMG 8.1.3
        props:
        - name: label
          value: 8.1.3
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.1.3_smt
          name: statement
          prose: The FI should continuously monitor the utilisation of its system
            resources against a set of pre-defined thresholds. [13](#1409967f-af1d-5199-95a7-5bfddc159dd3)
            Such monitoring could facilitate the FI in carrying out capacity management
            to ensure IT resources are adequate to meet current and future business
            needs.
        links:
        - href: '#1409967f-af1d-5199-95a7-5bfddc159dd3'
          rel: reference
          text: Footnote 13
      - id: trmg-8.1.4
        class: trmg-guideline
        title: TRMG 8.1.4
        props:
        - name: label
          value: 8.1.4
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.1.4_smt
          name: statement
          prose: Procedures should be established to respond to situations when pre-defined
            thresholds for system resources and system performance have been breached.
    - id: trmg-g-8.2
      class: trmg-section
      title: System Recoverability
      props:
      - name: label
        value: '8.2'
      controls:
      - id: trmg-8.2.1
        class: trmg-guideline
        title: TRMG 8.2.1
        props:
        - name: label
          value: 8.2.1
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.2.1_smt
          name: statement
          prose: The FI should establish systems’ recovery time objectives (RTO) and
            recovery point objectives (RPO) that are aligned to its business resumption
            and system recovery priorities.
      - id: trmg-8.2.2
        class: trmg-guideline
        title: TRMG 8.2.2
        props:
        - name: label
          value: 8.2.2
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.2.2_smt
          name: statement
          prose: The FI’s disaster recovery plan should include procedures to recover
            systems from various disaster scenarios, as well as the roles and responsibilities
            of relevant personnel in the recovery process. The disaster recovery plan
            should be reviewed at least annually and updated when there are material
            changes to business operations, information assets or environmental factors.
      - id: trmg-8.2.3
        class: trmg-guideline
        title: TRMG 8.2.3
        props:
        - name: label
          value: 8.2.3
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.2.3_smt
          name: statement
          prose: During the recovery process, the FI should follow the established
            disaster recovery plan that has been tested and approved by management.
            The FI should avoid deviating from the plan as untested recovery measures
            could exacerbate the incident and prolong the recovery process. In exceptional
            circumstances where untested recovery measures need to be used, the FI
            should perform a risk assessment and ensure adequate controls are in place,
            as well as obtain approval from senior management.
      - id: trmg-8.2.4
        class: trmg-guideline
        title: TRMG 8.2.4
        props:
        - name: label
          value: 8.2.4
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.2.4_smt
          name: statement
          prose: The FI should endeavour to operate from its recovery, secondary or
            alternate site periodically so as to have the assurance that its infrastructure
            and systems at these sites are able to support business needs for an extended
            period of time when production systems failover from the primary or production
            site.
    - id: trmg-g-8.3
      class: trmg-section
      title: Testing of Disaster Recovery Plan
      props:
      - name: label
        value: '8.3'
      controls:
      - id: trmg-8.3.1
        class: trmg-guideline
        title: TRMG 8.3.1
        props:
        - name: label
          value: 8.3.1
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.3.1_smt
          name: statement
          prose: The FI should perform regular testing of its disaster recovery plan
            to validate the effectiveness of the plan and ensure its systems are able
            to meet the defined recovery objectives. Relevant stakeholders, including
            those in business and IT functions, should participate in the disaster
            recovery test to familiarise themselves with the recovery processes and
            ascertain if the systems are performing as expected.
      - id: trmg-8.3.2
        class: trmg-guideline
        title: TRMG 8.3.2
        props:
        - name: label
          value: 8.3.2
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.3.2_smt
          name: statement
          prose: A disaster recovery test plan should include the test objectives
            and scope, test scenarios, test scripts with details of the activities
            to be performed during and after testing, system recovery procedures,
            and the criteria for measuring the success of the test.
      - id: trmg-8.3.3
        class: trmg-guideline
        title: TRMG 8.3.3
        props:
        - name: label
          value: 8.3.3
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.3.3_smt
          name: statement
          prose: 'The testing of disaster recovery plan should comprise: various plausible
            disruption scenarios, including full and partial incapacitation of the
            primary or production site and major system failures; and recovery dependencies
            between information assets, including those managed by third parties.'
      - id: trmg-8.3.4
        class: trmg-guideline
        title: TRMG 8.3.4
        props:
        - name: label
          value: 8.3.4
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.3.4_smt
          name: statement
          prose: Where information assets are managed by service providers, the FI
            should assess the service provider’s disaster recovery capability and
            ensure disaster recovery arrangements for these information assets are
            established, tested and verified to meet its business needs. The FI should
            engage its service provider to test the recovery steps that require coordinated
            actions between the service provider and the FI.
    - id: trmg-g-8.4
      class: trmg-section
      title: System Backup and Recovery
      props:
      - name: label
        value: '8.4'
      controls:
      - id: trmg-8.4.1
        class: trmg-guideline
        title: TRMG 8.4.1
        props:
        - name: label
          value: 8.4.1
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.4.1_smt
          name: statement
          prose: The FI should establish a system and data backup strategy, and develop
            a plan to perform regular backups so that systems and data can be recovered
            in the event of a system disruption or when data is corrupted or deleted.
      - id: trmg-8.4.2
        class: trmg-guideline
        title: TRMG 8.4.2
        props:
        - name: label
          value: 8.4.2
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.4.2_smt
          name: statement
          prose: To ensure data availability is aligned with the FI’s business requirements,
            the FI should institute a policy to manage the backup data life cycle,
            which includes the establishment of the frequency of data backup and data
            retention period, management of data storage mechanisms, and secure destruction
            of backup data.
      - id: trmg-8.4.3
        class: trmg-guideline
        title: TRMG 8.4.3
        props:
        - name: label
          value: 8.4.3
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.4.3_smt
          name: statement
          prose: The FI should periodically test the restoration of its system and
            data backups to validate the effectiveness of its backup restoration procedures.
      - id: trmg-8.4.4
        class: trmg-guideline
        title: TRMG 8.4.4
        props:
        - name: label
          value: 8.4.4
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.4.4_smt
          name: statement
          prose: To protect data in backup from unauthorised access and modification,
            the FI should ensure any confidential data stored in the backup media
            is secured (e.g. encrypted). Backup media should be stored offline or
            at an offsite location.
    - id: trmg-g-8.5
      class: trmg-section
      title: Data Centre Resilience
      props:
      - name: label
        value: '8.5'
      controls:
      - id: trmg-8.5.1
        class: trmg-guideline
        title: TRMG 8.5.1
        props:
        - name: label
          value: 8.5.1
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.5.1_smt
          name: statement
          prose: The FI should conduct a Threat and Vulnerability Risk Assessment
            (TVRA) for its data centres (DCs) to identify potential vulnerabilities
            and weaknesses, and the protection that should be established to safeguard
            the DCs against physical and environmental threats. [14](#c6f24956-d425-51bb-bb80-2c63f63b8121)
            In addition, the TVRA should consider the political and economic climate
            of the country in which the DCs are located. The TVRA should be reviewed
            whenever there is a significant change in the threat landscape or when
            there is a material change in the DC’s environment.
        links:
        - href: '#c6f24956-d425-51bb-bb80-2c63f63b8121'
          rel: reference
          text: Footnote 14
      - id: trmg-8.5.2
        class: trmg-guideline
        title: TRMG 8.5.2
        props:
        - name: label
          value: 8.5.2
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.5.2_smt
          name: statement
          prose: 'The FI should ensure adequate redundancy for the power, network
            connectivity, and cooling, electrical and mechanical systems of the DC
            to eliminate any single point of failure. Consideration should be given
            to the following: diversification of data communications and network paths;
            deployment of power equipment, such as uninterruptable power sources,
            backup diesel generators with fuel tanks; and implementation of redundant
            cooling equipment (e.g. cooling towers, chilled water supply and computer
            room air conditioning units) to control the temperature and humidity levels
            in the DC and prevent fluctuations potentially harmful to systems.'
      - id: trmg-8.5.3
        class: trmg-guideline
        title: TRMG 8.5.3
        props:
        - name: label
          value: 8.5.3
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.5.3_smt
          name: statement
          prose: As part of the DC’s environmental controls, the FI should implement
            fire detection and suppression devices or systems, such as smoke or heat
            detectors, inert gas suppression systems, and wet or dry sprinkler systems.
      - id: trmg-8.5.4
        class: trmg-guideline
        title: TRMG 8.5.4
        props:
        - name: label
          value: 8.5.4
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.5.4_smt
          name: statement
          prose: The FI’s secondary or disaster recovery DC should be geographically
            separated from its primary or production DC so that both sites will not
            be impacted by a disruption to the underlying infrastructure (e.g. telecommunications
            and power) in a particular location.
      - id: trmg-8.5.5
        class: trmg-guideline
        title: TRMG 8.5.5
        props:
        - name: label
          value: 8.5.5
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.5.5_smt
          name: statement
          prose: The DC’s physical security and environmental controls should be monitored
            on a 24 by 7 basis. Appropriate escalation, response plans and procedures
            for physical and environmental incidents at DCs should be established
            and tested.
      - id: trmg-8.5.6
        class: trmg-guideline
        title: TRMG 8.5.6
        props:
        - name: label
          value: 8.5.6
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-8.5.6_smt
          name: statement
          prose: 'The DC should have adequate physical access controls including:
            access granted to staff should be on a need-to-have basis, and revoked
            promptly if access is no longer required; proper notification and approval
            for visitors to the DC. All visitors should be escorted by authorised
            staff at all times while in the DC; physical access points in the DC should
            be secured and monitored at all times; access to equipment racks should
            be restricted to authorised staff and monitored; access to keys and other
            physical access devices should be restricted to authorised staff, and
            replaced or changed promptly if they have been misplaced, lost or stolen;
            and segregation of delivery and common areas from security sensitive areas
            should be enforced.'
  - id: trmg-g-9
    class: trmg-chapter
    title: Access Control
    props:
    - name: label
      value: '9'
    groups:
    - id: trmg-g-9.1
      class: trmg-section
      title: User Access Management
      props:
      - name: label
        value: '9.1'
      controls:
      - id: trmg-9.1.1
        class: trmg-guideline
        title: TRMG 9.1.1
        props:
        - name: label
          value: 9.1.1
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.1_smt
          name: statement
          prose: The principles of ‘never alone’, [15](#a0c64b55-fa00-54a5-a0af-3e089b10c8aa)
            ‘segregation of duties’, [16](#f123647b-b93a-5333-813c-1a336a8e52ee) and
            ‘least privilege’ [17](#34b7c739-ca43-57c3-86f0-e18b2957a85d) should be
            applied when granting staff access to information assets so that no one
            person has access to perform sensitive system functions. [18](#c00f37b6-1420-50e9-a4f3-f7bbb3504ec2)
            Access rights and system privileges should be granted according to the
            roles and responsibilities of the staff, contractors and service providers.
        links:
        - href: '#a0c64b55-fa00-54a5-a0af-3e089b10c8aa'
          rel: reference
          text: Footnote 15
        - href: '#f123647b-b93a-5333-813c-1a336a8e52ee'
          rel: reference
          text: Footnote 16
        - href: '#34b7c739-ca43-57c3-86f0-e18b2957a85d'
          rel: reference
          text: Footnote 17
        - href: '#c00f37b6-1420-50e9-a4f3-f7bbb3504ec2'
          rel: reference
          text: Footnote 18
      - id: trmg-9.1.2
        class: trmg-guideline
        title: TRMG 9.1.2
        props:
        - name: label
          value: 9.1.2
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.2_smt
          name: statement
          prose: The FI should establish a user access management process [19](#cdfbd20e-85d2-5cbb-95ee-780872d1ad5b)
            to provision, change and revoke access rights to information assets. Access
            rights should be authorised and approved by appropriate parties, such
            as the information asset owner.
        links:
        - href: '#cdfbd20e-85d2-5cbb-95ee-780872d1ad5b'
          rel: reference
          text: Footnote 19
      - id: trmg-9.1.3
        class: trmg-guideline
        title: TRMG 9.1.3
        props:
        - name: label
          value: 9.1.3
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.3_smt
          name: statement
          prose: For proper accountability, the FI should ensure records of user access
            and user management activities are uniquely identified and logged for
            audit and investigation purposes.
      - id: trmg-9.1.4
        class: trmg-guideline
        title: TRMG 9.1.4
        props:
        - name: label
          value: 9.1.4
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.4_smt
          name: statement
          prose: The FI should establish a password policy and a process to enforce
            strong password controls [20](#5c618a7a-104d-5f5c-aee6-91ebb62c7a1f) for
            users’ access to IT systems.
        links:
        - href: '#5c618a7a-104d-5f5c-aee6-91ebb62c7a1f'
          rel: reference
          text: Footnote 20
      - id: trmg-9.1.5
        class: trmg-guideline
        title: TRMG 9.1.5
        props:
        - name: label
          value: 9.1.5
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.5_smt
          name: statement
          prose: Multi-factor authentication [21](#a5d0c22b-4933-59e9-87ab-e3f6e68e1ac2)
            should be implemented for users with access to sensitive system functions
            to safeguard the systems and data from unauthorised access.
        links:
        - href: '#a5d0c22b-4933-59e9-87ab-e3f6e68e1ac2'
          rel: reference
          text: Footnote 21
      - id: trmg-9.1.6
        class: trmg-guideline
        title: TRMG 9.1.6
        props:
        - name: label
          value: 9.1.6
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.6_smt
          name: statement
          prose: The FI should ensure appropriate parties such as information asset
            owners perform periodic user access review to verify the appropriateness
            of privileges that are granted to users. The user access review should
            be used to identify dormant and redundant user accounts, as well as inappropriate
            access rights. Exceptions noted from the user access review should be
            resolved as soon as practicable.
      - id: trmg-9.1.7
        class: trmg-guideline
        title: TRMG 9.1.7
        props:
        - name: label
          value: 9.1.7
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.7_smt
          name: statement
          prose: Users should only be granted access rights on a need-to-use basis.
            Access rights that are no longer needed, as a result of a change in a
            user’s job responsibilities or employment status (e.g. transfer or termination
            of employment), should be revoked or disabled promptly.
      - id: trmg-9.1.8
        class: trmg-guideline
        title: TRMG 9.1.8
        props:
        - name: label
          value: 9.1.8
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.1.8_smt
          name: statement
          prose: The FI should subject its service providers, who are given access
            to the FI’s information assets, to the same monitoring and access restrictions
            on the FI’s personnel.
    - id: trmg-g-9.2
      class: trmg-section
      title: Privileged Access Management
      props:
      - name: label
        value: '9.2'
      controls:
      - id: trmg-9.2.1
        class: trmg-guideline
        title: TRMG 9.2.1
        props:
        - name: label
          value: 9.2.1
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.2.1_smt
          name: statement
          prose: Users granted privileged system access have the ability to inflict
            severe damage on the stability and security of the FI’s IT environment.
            Access to privileged accounts should only be granted on a need-to-use
            basis; activities of these accounts should be logged and reviewed as part
            of the FI’s ongoing monitoring.
      - id: trmg-9.2.2
        class: trmg-guideline
        title: TRMG 9.2.2
        props:
        - name: label
          value: 9.2.2
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.2.2_smt
          name: statement
          prose: System and service accounts are used by operating systems, applications
            and databases to interact or access other systems’ resources. The FI should
            establish a process to manage and monitor the use of system and service
            accounts for suspicious or unauthorised activities.
    - id: trmg-g-9.3
      class: trmg-section
      title: Remote Access Management
      props:
      - name: label
        value: '9.3'
      controls:
      - id: trmg-9.3.1
        class: trmg-guideline
        title: TRMG 9.3.1
        props:
        - name: label
          value: 9.3.1
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.3.1_smt
          name: statement
          prose: Remote access allows users to connect to the FI’s internal network
            via an external network to access the FI’s data and systems, such as emails
            and business applications. Remote connections should be encrypted to prevent
            data leakage through network sniffing and eavesdropping. Strong authentication,
            such as multi-factor authentication, should be implemented for users performing
            remote access to safeguard against unauthorised access to the FI’s IT
            environment.
      - id: trmg-9.3.2
        class: trmg-guideline
        title: TRMG 9.3.2
        props:
        - name: label
          value: 9.3.2
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-9.3.2_smt
          name: statement
          prose: The FI should ensure remote access to the FI’s information assets
            is only allowed from devices that have been secured according to the FI’s
            security standards.
  - id: trmg-g-10
    class: trmg-chapter
    title: Cryptography
    props:
    - name: label
      value: '10'
    groups:
    - id: trmg-g-10.1
      class: trmg-section
      title: Cryptographic Algorithm and Protocol
      props:
      - name: label
        value: '10.1'
      controls:
      - id: trmg-10.1.1
        class: trmg-guideline
        title: TRMG 10.1.1
        props:
        - name: label
          value: 10.1.1
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.1.1_smt
          name: statement
          prose: The primary applications of cryptography are to protect data confidentiality,
            and maintain data integrity and authenticity. For example, cryptography
            is used in data encryption to protect sensitive data; cryptographic digital
            signatures can be used to verify the authenticity of the data origin and
            check if the data has been altered. Besides these applications, cryptography
            is also commonly used in authentication protocols.
      - id: trmg-10.1.2
        class: trmg-guideline
        title: TRMG 10.1.2
        props:
        - name: label
          value: 10.1.2
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.1.2_smt
          name: statement
          prose: The FI should adopt cryptographic algorithms from well-established
            international standards. The FI should also select an appropriate algorithm
            and encryption key length that meet its security objectives and requirements.
      - id: trmg-10.1.3
        class: trmg-guideline
        title: TRMG 10.1.3
        props:
        - name: label
          value: 10.1.3
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.1.3_smt
          name: statement
          prose: Where the security of the cryptographic algorithm depends on the
            unpredictability of a random seed or number, the FI should ensure the
            seed or random number is of sufficient length and randomness.
      - id: trmg-10.1.4
        class: trmg-guideline
        title: TRMG 10.1.4
        props:
        - name: label
          value: 10.1.4
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.1.4_smt
          name: statement
          prose: The FI should ensure all cryptographic algorithms used have been
            subject to rigorous testing or vetting to meet the identified security
            objectives and requirements.
      - id: trmg-10.1.5
        class: trmg-guideline
        title: TRMG 10.1.5
        props:
        - name: label
          value: 10.1.5
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.1.5_smt
          name: statement
          prose: The FI should monitor developments in the area of cryptanalysis and,
            where necessary, update or change the cryptographic algorithms or increase
            the key lengths to ensure they remain resilient against evolving threats.
    - id: trmg-g-10.2
      class: trmg-section
      title: Cryptographic Key Management
      props:
      - name: label
        value: '10.2'
      controls:
      - id: trmg-10.2.1
        class: trmg-guideline
        title: TRMG 10.2.1
        props:
        - name: label
          value: 10.2.1
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.1_smt
          name: statement
          prose: Cryptographic key management policy, standards and procedures covering
            key generation, distribution, installation, renewal, revocation, recovery
            and expiry should be established.
      - id: trmg-10.2.2
        class: trmg-guideline
        title: TRMG 10.2.2
        props:
        - name: label
          value: 10.2.2
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.2_smt
          name: statement
          prose: The FI should ensure cryptographic keys are securely generated and
            protected from unauthorised disclosure. Any cryptographic key or sensitive
            data used to generate or derive the keys should be also be protected or
            securely destroyed after the key is generated.
      - id: trmg-10.2.3
        class: trmg-guideline
        title: TRMG 10.2.3
        props:
        - name: label
          value: 10.2.3
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.3_smt
          name: statement
          prose: The FI should determine the appropriate lifespan of each cryptographic
            key based on factors, such as the sensitivity of the data, the criticality
            of the system to be protected, and the threats and risks that the data
            or system may be exposed to. The cryptographic key should be securely
            replaced, before it expires at the end of its lifespan.
      - id: trmg-10.2.4
        class: trmg-guideline
        title: TRMG 10.2.4
        props:
        - name: label
          value: 10.2.4
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.4_smt
          name: statement
          prose: To protect sensitive cryptographic keys, the FI should manage, process
            and store such keys in hardened and tamper resistant systems, e.g. by
            using a hardware security module.
      - id: trmg-10.2.5
        class: trmg-guideline
        title: TRMG 10.2.5
        props:
        - name: label
          value: 10.2.5
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.5_smt
          name: statement
          prose: Where sensitive cryptographic keys need to be transmitted, the FI
            should ensure these keys are not exposed during transmission. The keys
            should be distributed to the intended recipient via an out-of-band channel
            or other secure means to minimise the risk of interception.
      - id: trmg-10.2.6
        class: trmg-guideline
        title: TRMG 10.2.6
        props:
        - name: label
          value: 10.2.6
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.6_smt
          name: statement
          prose: Diversification of cryptographic keys can limit the impact of key
            exposure. Cryptographic keys should be used for a single purpose. For
            instance, the cryptographic key for data encryption should be different
            from the one that is used to generate cryptographic digital signatures.
      - id: trmg-10.2.7
        class: trmg-guideline
        title: TRMG 10.2.7
        props:
        - name: label
          value: 10.2.7
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.7_smt
          name: statement
          prose: If a cryptographic key is found to be compromised, the FI should
            revoke and replace the key and all other keys whose security could also
            be compromised as a result of the exposed key.
      - id: trmg-10.2.8
        class: trmg-guideline
        title: TRMG 10.2.8
        props:
        - name: label
          value: 10.2.8
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.8_smt
          name: statement
          prose: When cryptographic keys have expired or have been revoked, the FI
            should use a secure key destruction method to ensure the keys are not
            recoverable.
      - id: trmg-10.2.9
        class: trmg-guideline
        title: TRMG 10.2.9
        props:
        - name: label
          value: 10.2.9
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.9_smt
          name: statement
          prose: When replacing or renewing a compromised or expiring cryptographic
            key, the FI should generate the new key in a manner such that any adversary
            who has knowledge of part or whole of the previous key will not be able
            to derive the new key from it.
      - id: trmg-10.2.10
        class: trmg-guideline
        title: TRMG 10.2.10
        props:
        - name: label
          value: 10.2.10
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-10.2.10_smt
          name: statement
          prose: Cryptographic keys can be corrupted or unintentionally deleted. As
            such, the FI should maintain backups of cryptographic keys for recovery
            purposes and accord them a high level of protection.
  - id: trmg-g-11
    class: trmg-chapter
    title: Data and Infrastructure Security
    props:
    - name: label
      value: '11'
    groups:
    - id: trmg-g-11.1
      class: trmg-section
      title: Data Security
      props:
      - name: label
        value: '11.1'
      controls:
      - id: trmg-11.1.1
        class: trmg-guideline
        title: TRMG 11.1.1
        props:
        - name: label
          value: 11.1.1
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.1_smt
          name: statement
          prose: 'The FI should develop comprehensive data loss prevention policies
            and adopt measures to detect and prevent unauthorised access, modification,
            copying, or transmission of its confidential data, taking into consideration
            the following: data in motion - data that traverses a network or that
            is transported between sites; data at rest - data in endpoint devices
            such as notebooks, personal computers, portable storage devices and mobile
            devices, as well as data in systems such as files stored on servers, databases,
            backup media and storage platforms (e.g. cloud); and data in use - data
            that is being used or processed by a system.'
      - id: trmg-11.1.2
        class: trmg-guideline
        title: TRMG 11.1.2
        props:
        - name: label
          value: 11.1.2
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.2_smt
          name: statement
          prose: The FI should implement appropriate measures to prevent and detect
            data theft, as well as unauthorised modification in systems and endpoint
            devices. The FI should ensure systems managed by the FI’s service providers
            are accorded the same level of protection and subject to the same security
            standards.
      - id: trmg-11.1.3
        class: trmg-guideline
        title: TRMG 11.1.3
        props:
        - name: label
          value: 11.1.3
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.3_smt
          name: statement
          prose: Systems and endpoint devices are often targeted by cyber criminals
            to gain access or exfiltrate confidential data within an organisation.
            As such, confidential data stored in systems and endpoint devices should
            be encrypted and protected by strong access controls.
      - id: trmg-11.1.4
        class: trmg-guideline
        title: TRMG 11.1.4
        props:
        - name: label
          value: 11.1.4
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.4_smt
          name: statement
          prose: The FI should ensure only authorised data storage media, systems
            and endpoint devices are used to communicate, transfer, or store confidential
            data.
      - id: trmg-11.1.5
        class: trmg-guideline
        title: TRMG 11.1.5
        props:
        - name: label
          value: 11.1.5
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.5_smt
          name: statement
          prose: Security measures should be implemented to prevent and detect the
            use of unauthorised internet services which allow users to communicate
            or store confidential data. Examples of such services include social media,
            cloud storage and file sharing, emails, and messaging applications.
      - id: trmg-11.1.6
        class: trmg-guideline
        title: TRMG 11.1.6
        props:
        - name: label
          value: 11.1.6
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.6_smt
          name: statement
          prose: The use of sensitive production data in non-production environments
            should be restricted. In exceptional situations where such data needs
            to be used in non-production environments, proper approval has to be obtained
            from senior management. The FI should ensure appropriate controls are
            implemented in non-production environments to manage the access and removal
            of such data to prevent data leakage. Where possible, such data should
            be masked in the non-production environments.
      - id: trmg-11.1.7
        class: trmg-guideline
        title: TRMG 11.1.7
        props:
        - name: label
          value: 11.1.7
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.1.7_smt
          name: statement
          prose: The FI should ensure confidential data is irrevocably deleted from
            storage media, systems and endpoint devices before they are disposed of
            or redeployed.
    - id: trmg-g-11.2
      class: trmg-section
      title: Network Security
      props:
      - name: label
        value: '11.2'
      controls:
      - id: trmg-11.2.1
        class: trmg-guideline
        title: TRMG 11.2.1
        props:
        - name: label
          value: 11.2.1
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.1_smt
          name: statement
          prose: The FI should install network security devices such as firewalls
            to secure the network between the FI and the Internet, as well as connections
            with third parties.
      - id: trmg-11.2.2
        class: trmg-guideline
        title: TRMG 11.2.2
        props:
        - name: label
          value: 11.2.2
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.2_smt
          name: statement
          prose: To minimise the risk of cyber threats, such as lateral movement and
            insider threat, the FI should deploy effective security mechanisms to
            protect information assets. Information assets could be grouped into network
            segments based on the criticality of systems, the system’s functional
            role (e.g. database and application) or the sensitivity of the data.
      - id: trmg-11.2.3
        class: trmg-guideline
        title: TRMG 11.2.3
        props:
        - name: label
          value: 11.2.3
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.3_smt
          name: statement
          prose: Network intrusion prevention systems should be deployed in the FI’s
            network to detect and block malicious network traffic.
      - id: trmg-11.2.4
        class: trmg-guideline
        title: TRMG 11.2.4
        props:
        - name: label
          value: 11.2.4
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.4_smt
          name: statement
          prose: The FI should implement network access controls to detect and prevent
            unauthorised devices from connecting to its network.
      - id: trmg-11.2.5
        class: trmg-guideline
        title: TRMG 11.2.5
        props:
        - name: label
          value: 11.2.5
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.5_smt
          name: statement
          prose: Network access control rules in network devices such as firewalls,
            routers, switches and access points should be reviewed on a regular basis
            to ensure they are kept up-to-date. Obsolete rules and insecure network
            protocols should be removed promptly as these can be exploited to gain
            unauthorised access to the FI’s network and systems.
      - id: trmg-11.2.6
        class: trmg-guideline
        title: TRMG 11.2.6
        props:
        - name: label
          value: 11.2.6
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.6_smt
          name: statement
          prose: Internet web browsing provides a conduit for cyber criminals to access
            the FI’s IT systems. In this regard, the FI should consider isolating
            internet web browsing activities from its endpoint devices through the
            use of physical or logical controls, or implement equivalent controls,
            so as to reduce exposure of its IT systems to cyber attacks.
      - id: trmg-11.2.7
        class: trmg-guideline
        title: TRMG 11.2.7
        props:
        - name: label
          value: 11.2.7
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.7_smt
          name: statement
          prose: An effective DoS protection should be implemented to detect and respond
            to various types of DoS attacks. [22](#3dbb4b3b-e823-5687-86b4-7bd50dcdd4a3)
            The FI could engage DoS mitigation service providers to filter potential
            DoS traffic before it reaches the FI’s network infrastructure.
        links:
        - href: '#3dbb4b3b-e823-5687-86b4-7bd50dcdd4a3'
          rel: reference
          text: Footnote 22
      - id: trmg-11.2.8
        class: trmg-guideline
        title: TRMG 11.2.8
        props:
        - name: label
          value: 11.2.8
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.2.8_smt
          name: statement
          prose: A review of the FI’s network architecture, including the network
            security design, as well as system and network interconnections, should
            be conducted on a periodic basis to identify potential cyber security
            vulnerabilities.
    - id: trmg-g-11.3
      class: trmg-section
      title: System Security
      props:
      - name: label
        value: '11.3'
      controls:
      - id: trmg-11.3.1
        class: trmg-guideline
        title: TRMG 11.3.1
        props:
        - name: label
          value: 11.3.1
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.1_smt
          name: statement
          prose: The security standards for the FI’s hardware and software (e.g. operating
            systems, databases, network devices and endpoint devices) should outline
            the configurations that will minimise their exposure to cyber threats.
            The standards should be reviewed periodically for relevance and effectiveness.
      - id: trmg-11.3.2
        class: trmg-guideline
        title: TRMG 11.3.2
        props:
        - name: label
          value: 11.3.2
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.2_smt
          name: statement
          prose: The FI should establish a process to verify that the standards are
            applied uniformly on systems and to identify deviations from the standards.
            Risks arising from deviations should be addressed in a timely manner.
      - id: trmg-11.3.3
        class: trmg-guideline
        title: TRMG 11.3.3
        props:
        - name: label
          value: 11.3.3
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.3_smt
          name: statement
          prose: Endpoint protection, which includes but is not limited to behavioural-based
            and signature-based solutions, should be implemented to protect the FI
            from malware infection and address common delivery channels of malware,
            such as malicious links, websites, email attachments or infected removable
            storage media.
      - id: trmg-11.3.4
        class: trmg-guideline
        title: TRMG 11.3.4
        props:
        - name: label
          value: 11.3.4
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.4_smt
          name: statement
          prose: The FI should ensure that anti-malware signatures are kept up-to-date
            and the systems are regularly scanned for malicious files or anomalous
            activities.
      - id: trmg-11.3.5
        class: trmg-guideline
        title: TRMG 11.3.5
        props:
        - name: label
          value: 11.3.5
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.5_smt
          name: statement
          prose: To facilitate early detection and prompt remediation of suspicious
            or malicious systems activities, the FI should implement detection and
            response mechanisms to perform scanning of indicators of compromise (IOCs)
            in a timely manner, and proactively monitor systems’, including endpoint
            systems’, processes for anomalies and suspicious activities.
      - id: trmg-11.3.6
        class: trmg-guideline
        title: TRMG 11.3.6
        props:
        - name: label
          value: 11.3.6
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.6_smt
          name: statement
          prose: Security measures, such as application white-listing, should be implemented
            to ensure only authorised software is allowed to be installed on the FI’s
            systems.
      - id: trmg-11.3.7
        class: trmg-guideline
        title: TRMG 11.3.7
        props:
        - name: label
          value: 11.3.7
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.3.7_smt
          name: statement
          prose: When implementing Bring Your Own Device (BYOD) [23](#9bba054f-03d7-5c6e-9168-42e6761a02a8)
            , the FI should conduct a comprehensive risk assessment and implement
            appropriate measures to secure its BYOD environment before allowing staff
            to use their personal devices to access the corporate network. Refer to
            Annex B on the security measures for BYOD.
        links:
        - href: '#9bba054f-03d7-5c6e-9168-42e6761a02a8'
          rel: reference
          text: Footnote 23
    - id: trmg-g-11.4
      class: trmg-section
      title: Virtualisation Security
      props:
      - name: label
        value: '11.4'
      controls:
      - id: trmg-11.4.1
        class: trmg-guideline
        title: TRMG 11.4.1
        props:
        - name: label
          value: 11.4.1
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.4.1_smt
          name: statement
          prose: Virtualisation [24](#807ca0b1-312c-5f8f-aa2a-3de301219dae) is used
            by organisations to optimise the use of computing resources and to enhance
            resilience. The technology allows several virtual machines (VMs) that
            support different business applications to be hosted on a physical system.
            A system failure or security breach in one of the VMs could have contagion
            impact on other VMs. The FI should ensure security standards are established
            for all components [25](#e2efd905-da2a-5be9-8a6d-3b777c665a34) of a virtualisation
            solution.
        links:
        - href: '#807ca0b1-312c-5f8f-aa2a-3de301219dae'
          rel: reference
          text: Footnote 24
        - href: '#e2efd905-da2a-5be9-8a6d-3b777c665a34'
          rel: reference
          text: Footnote 25
      - id: trmg-11.4.2
        class: trmg-guideline
        title: TRMG 11.4.2
        props:
        - name: label
          value: 11.4.2
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.4.2_smt
          name: statement
          prose: Strong access controls should be implemented to restrict administrative
            access to the hypervisor and host operating system as both control the
            guest operating systems and other components in the virtual environment.
      - id: trmg-11.4.3
        class: trmg-guideline
        title: TRMG 11.4.3
        props:
        - name: label
          value: 11.4.3
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.4.3_smt
          name: statement
          prose: The FI should establish policies and standards to manage virtual
            images and snapshots. The standards should include details that govern
            the security, creation, distribution, storage, use, retirement and destruction
            of virtual images and snapshots so as to protect these assets against
            unauthorised access or modification.
    - id: trmg-g-11.5
      class: trmg-section
      title: Internet of Things
      props:
      - name: label
        value: '11.5'
      controls:
      - id: trmg-11.5.1
        class: trmg-guideline
        title: TRMG 11.5.1
        props:
        - name: label
          value: 11.5.1
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.5.1_smt
          name: statement
          prose: Internet of Things (IoT) includes any electronic devices, such as
            smart phones, multi-function printers, security cameras and smart televisions,
            which can be connected to the FI’s network or the Internet. As with all
            information assets, the FI should maintain an inventory of all its IoT
            devices, including information such as the networks which they are connected
            to and their physical locations.
      - id: trmg-11.5.2
        class: trmg-guideline
        title: TRMG 11.5.2
        props:
        - name: label
          value: 11.5.2
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.5.2_smt
          name: statement
          prose: Many IoT devices are designed without or with minimal security controls.
            If compromised, these devices can be commandeered and used to gain unauthorised
            access to the FI’s network and systems or as a launch pad for cyber attacks
            on the FI. The FI should assess and implement processes and controls to
            mitigate risks arising from IoT.
      - id: trmg-11.5.3
        class: trmg-guideline
        title: TRMG 11.5.3
        props:
        - name: label
          value: 11.5.3
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.5.3_smt
          name: statement
          prose: The network that hosts IoT devices should be secured. For instance,
            network access controls can be implemented to restrict network traffic
            to and from an IoT device to prevent a cyber threat actor from accessing
            the FI’s network and launching malware or DoS attacks. To further reduce
            IoT risks, the FI should host IoT devices in a separate network segment
            from the network that hosts the FI’s systems and confidential data.
      - id: trmg-11.5.4
        class: trmg-guideline
        title: TRMG 11.5.4
        props:
        - name: label
          value: 11.5.4
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.5.4_smt
          name: statement
          prose: The FI should implement controls to prevent unauthorised access to
            IoT devices.
      - id: trmg-11.5.5
        class: trmg-guideline
        title: TRMG 11.5.5
        props:
        - name: label
          value: 11.5.5
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-11.5.5_smt
          name: statement
          prose: Similar to other systems, the FI should monitor IoT devices for suspicious
            or anomalous system activities so that prompt actions can be taken to
            isolate compromised devices.
  - id: trmg-g-12
    class: trmg-chapter
    title: Cyber Security Operations
    props:
    - name: label
      value: '12'
    groups:
    - id: trmg-g-12.1
      class: trmg-section
      title: Cyber Threat Intelligence and Information Sharing
      props:
      - name: label
        value: '12.1'
      controls:
      - id: trmg-12.1.1
        class: trmg-guideline
        title: TRMG 12.1.1
        props:
        - name: label
          value: 12.1.1
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.1.1_smt
          name: statement
          prose: To maintain good cyber situational awareness, the FI should establish
            a process to collect, process and analyse cyber-related information for
            its relevance and potential impact to the FI’s business and IT environment.
            Cyber-related information would include cyber events, cyber threat intelligence
            and information on system vulnerabilities.
      - id: trmg-12.1.2
        class: trmg-guideline
        title: TRMG 12.1.2
        props:
        - name: label
          value: 12.1.2
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.1.2_smt
          name: statement
          prose: The FI should procure cyber intelligence monitoring services. As
            cyber threat information sharing is an important component of cyber resilience
            within the financial ecosystem, the FI should actively participate in
            cyber threat information-sharing arrangements with trusted parties to
            share and receive timely and actionable cyber threat information.
      - id: trmg-12.1.3
        class: trmg-guideline
        title: TRMG 12.1.3
        props:
        - name: label
          value: 12.1.3
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.1.3_smt
          name: statement
          prose: At the same time, the FI should establish a process to detect and
            respond to misinformation related to the FI that are propagated via the
            Internet. The FI should consider engaging external media monitoring services
            to facilitate the evaluation and identification of online misinformation.
    - id: trmg-g-12.2
      class: trmg-section
      title: Cyber Event Monitoring and Detection
      props:
      - name: label
        value: '12.2'
      controls:
      - id: trmg-12.2.1
        class: trmg-guideline
        title: TRMG 12.2.1
        props:
        - name: label
          value: 12.2.1
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.2.1_smt
          name: statement
          prose: To facilitate continuous monitoring and analysis of cyber events;
            [26](#397bc18a-fbc8-54f2-b0e9-d576bcaad4eb) as well as prompt detection
            and response to cyber incidents, the FI should establish a security operations
            centre or acquire managed security services. The processes, roles and
            responsibilities for security operations should be defined.
        links:
        - href: '#397bc18a-fbc8-54f2-b0e9-d576bcaad4eb'
          rel: reference
          text: Footnote 26
      - id: trmg-12.2.2
        class: trmg-guideline
        title: TRMG 12.2.2
        props:
        - name: label
          value: 12.2.2
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.2.2_smt
          name: statement
          prose: A process to collect, process, review and retain system logs [27](#c594de4b-ae71-5825-99d7-59ae8acdafdc)
            should be established to facilitate the FI’s security monitoring operations.
            These logs should be protected against unauthorised access.
        links:
        - href: '#c594de4b-ae71-5825-99d7-59ae8acdafdc'
          rel: reference
          text: Footnote 27
      - id: trmg-12.2.3
        class: trmg-guideline
        title: TRMG 12.2.3
        props:
        - name: label
          value: 12.2.3
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.2.3_smt
          name: statement
          prose: To facilitate identification of anomalies, the FI should establish
            a baseline profile of each IT system’s routine activities and analyse
            the system activities against the baseline profiles. The profiles should
            be regularly reviewed and updated.
      - id: trmg-12.2.4
        class: trmg-guideline
        title: TRMG 12.2.4
        props:
        - name: label
          value: 12.2.4
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.2.4_smt
          name: statement
          prose: The FI should consider applying user behavioural analytics to enhance
            the effectiveness of security monitoring. User behavioural analytics might
            include the use of machine learning algorithms in real time to analyse
            system logs, establish a baseline of normal user activities and identify
            suspicious or anomalous behaviours.
      - id: trmg-12.2.5
        class: trmg-guideline
        title: TRMG 12.2.5
        props:
        - name: label
          value: 12.2.5
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.2.5_smt
          name: statement
          prose: Correlation of multiple events registered on system logs should be
            performed to identify suspicious or anomalous system activity patterns.
      - id: trmg-12.2.6
        class: trmg-guideline
        title: TRMG 12.2.6
        props:
        - name: label
          value: 12.2.6
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.2.6_smt
          name: statement
          prose: A process should be established to ensure timely escalation to relevant
            stakeholders regarding suspicious or anomalous system activities or user
            behaviour.
    - id: trmg-g-12.3
      class: trmg-section
      title: Cyber Incident Response and Management
      props:
      - name: label
        value: '12.3'
      controls:
      - id: trmg-12.3.1
        class: trmg-guideline
        title: TRMG 12.3.1
        props:
        - name: label
          value: 12.3.1
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.3.1_smt
          name: statement
          prose: The FI should establish a cyber incident response and management
            plan to swiftly isolate and neutralise a cyber threat and to securely
            resume affected services. The plan should describe communication, coordination
            and response procedures to address plausible cyber threat scenarios.
      - id: trmg-12.3.2
        class: trmg-guideline
        title: TRMG 12.3.2
        props:
        - name: label
          value: 12.3.2
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.3.2_smt
          name: statement
          prose: As part of the plan, the FI should establish a process to investigate
            and identify the security or control deficiencies that resulted in the
            security breach. The investigation should also evaluate the full extent
            of the impact to the FI.
      - id: trmg-12.3.3
        class: trmg-guideline
        title: TRMG 12.3.3
        props:
        - name: label
          value: 12.3.3
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-12.3.3_smt
          name: statement
          prose: Information from cyber intelligence and lessons learnt from cyber
            incidents should be used to enhance the existing controls or improve the
            cyber incident management plan.
  - id: trmg-g-13
    class: trmg-chapter
    title: Cyber Security Assessment
    props:
    - name: label
      value: '13'
    groups:
    - id: trmg-g-13.1
      class: trmg-section
      title: Vulnerability Assessment
      props:
      - name: label
        value: '13.1'
      controls:
      - id: trmg-13.1.1
        class: trmg-guideline
        title: TRMG 13.1.1
        props:
        - name: label
          value: 13.1.1
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.1.1_smt
          name: statement
          prose: The FI should establish a process to conduct regular vulnerability
            assessment (VA) on their IT systems to identify security vulnerabilities
            and ensure risk arising from these gaps are addressed in a timely manner.
            The frequency of VA should be commensurate with the criticality of the
            IT system and the security risk to which it is exposed.
      - id: trmg-13.1.2
        class: trmg-guideline
        title: TRMG 13.1.2
        props:
        - name: label
          value: 13.1.2
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.1.2_smt
          name: statement
          prose: When performing VA, the scope should minimally include vulnerability
            discovery, identification of weak security configurations, and open network
            ports, as well as application vulnerabilities. For web-based systems,
            the scope of VA should include checks on common web-based vulnerabilities.
    - id: trmg-g-13.2
      class: trmg-section
      title: Penetration Testing
      props:
      - name: label
        value: '13.2'
      controls:
      - id: trmg-13.2.1
        class: trmg-guideline
        title: TRMG 13.2.1
        props:
        - name: label
          value: 13.2.1
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.2.1_smt
          name: statement
          prose: The FI should carry out penetration testing (PT) [28](#b6a28777-7da1-539c-a3e6-cc1b9714905a)
            to obtain an in-depth evaluation of its cyber security defences. A combination
            of blackbox and greybox testing should be conducted for online financial
            services.
        links:
        - href: '#b6a28777-7da1-539c-a3e6-cc1b9714905a'
          rel: reference
          text: Footnote 28
      - id: trmg-13.2.2
        class: trmg-guideline
        title: TRMG 13.2.2
        props:
        - name: label
          value: 13.2.2
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.2.2_smt
          name: statement
          prose: A bug bounty programme is another means by which an FI could discover
            vulnerabilities in their IT systems by inviting and incentivising ethical
            or “white hat” hackers to conduct PT on their systems. The FI may consider
            conducting a bug bounty programme to test the security of its IT infrastructure
            to complement its PT.
      - id: trmg-13.2.3
        class: trmg-guideline
        title: TRMG 13.2.3
        props:
        - name: label
          value: 13.2.3
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.2.3_smt
          name: statement
          prose: To obtain a more accurate assessment of the robustness of the FI’s
            security measures, PT should be conducted on the production environment.
            Proper safeguards should be implemented when PT is conducted on the production
            environment.
      - id: trmg-13.2.4
        class: trmg-guideline
        title: TRMG 13.2.4
        props:
        - name: label
          value: 13.2.4
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.2.4_smt
          name: statement
          prose: The frequency of PT should be determined based on factors such as
            system criticality and the system’s exposure to cyber risks. For systems
            that are directly accessible from the Internet, the FI is expected to
            conduct PT to validate the adequacy of the security controls at least
            once annually or whenever these systems undergo major changes or updates.
    - id: trmg-g-13.3
      class: trmg-section
      title: Cyber Exercises
      props:
      - name: label
        value: '13.3'
      controls:
      - id: trmg-13.3.1
        class: trmg-guideline
        title: TRMG 13.3.1
        props:
        - name: label
          value: 13.3.1
        - name: source-page
          value: '46'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.3.1_smt
          name: statement
          prose: The FI should carry out regular scenario-based cyber exercises to
            validate its response and recovery, as well as communication plans against
            cyber threats. These exercises could include social engineering, [29](#3f498dbe-92bd-52ca-82d2-97c83e75ae84)
            table-top, [30](#73fa4c0f-659f-5239-8fec-b22671c05dc5) or cyber range
            [31](#a4c4caf0-949c-555b-b25e-c284ee06b1bd) exercises.
        links:
        - href: '#3f498dbe-92bd-52ca-82d2-97c83e75ae84'
          rel: reference
          text: Footnote 29
        - href: '#73fa4c0f-659f-5239-8fec-b22671c05dc5'
          rel: reference
          text: Footnote 30
        - href: '#a4c4caf0-949c-555b-b25e-c284ee06b1bd'
          rel: reference
          text: Footnote 31
      - id: trmg-13.3.2
        class: trmg-guideline
        title: TRMG 13.3.2
        props:
        - name: label
          value: 13.3.2
        - name: source-page
          value: '46'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.3.2_smt
          name: statement
          prose: Depending on the exercise objectives, the FI should involve relevant
            stakeholders, including senior management, business functions, corporate
            communications, crisis management team, service providers, and technical
            staff responsible for cyber threat detection, response and recovery.
    - id: trmg-g-13.4
      class: trmg-section
      title: Adversarial Attack Simulation Exercise
      props:
      - name: label
        value: '13.4'
      controls:
      - id: trmg-13.4.1
        class: trmg-guideline
        title: TRMG 13.4.1
        props:
        - name: label
          value: 13.4.1
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.4.1_smt
          name: statement
          prose: The FI should perform an adversarial attack simulation exercise [32](#1efdbe0b-579e-5c4c-a789-0a2538df88e2)
            to test and validate the effectiveness of its cyber defence and response
            plan against prevalent cyber threats.
        links:
        - href: '#1efdbe0b-579e-5c4c-a789-0a2538df88e2'
          rel: reference
          text: Footnote 32
      - id: trmg-13.4.2
        class: trmg-guideline
        title: TRMG 13.4.2
        props:
        - name: label
          value: 13.4.2
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.4.2_smt
          name: statement
          prose: The objectives, scope and rules of engagement should be defined before
            the commencement of the exercise, and the exercise should be conducted
            in a controlled manner under close supervision to ensure the activities
            carried out by the red team [33](#3c2e706e-44a4-5b1a-829f-8d7b94313f2b)
            do not disrupt the FI’s production systems.
        links:
        - href: '#3c2e706e-44a4-5b1a-829f-8d7b94313f2b'
          rel: reference
          text: Footnote 33
    - id: trmg-g-13.5
      class: trmg-section
      title: Intelligence-Based Scenario Design
      props:
      - name: label
        value: '13.5'
      controls:
      - id: trmg-13.5.1
        class: trmg-guideline
        title: TRMG 13.5.1
        props:
        - name: label
          value: 13.5.1
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.5.1_smt
          name: statement
          prose: To simulate realistic adversarial attacks during any cyber security
            assessment, the threat scenario should be designed and based on challenging
            but plausible cyber threats.
      - id: trmg-13.5.2
        class: trmg-guideline
        title: TRMG 13.5.2
        props:
        - name: label
          value: 13.5.2
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.5.2_smt
          name: statement
          prose: The FI could also design the exercise scenario by using threat intelligence
            that is relevant to their IT environment to identify threat actors who
            are most likely to pose a threat to the FI; and identify the tactics,
            techniques and procedures most likely to be used in such attacks.
    - id: trmg-g-13.6
      class: trmg-section
      title: Remediation Management
      props:
      - name: label
        value: '13.6'
      controls:
      - id: trmg-13.6.1
        class: trmg-guideline
        title: TRMG 13.6.1
        props:
        - name: label
          value: 13.6.1
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-13.6.1_smt
          name: statement
          prose: 'A comprehensive remediation process should be established to track
            and resolve issues identified from the cyber security assessments or exercises.
            The process should minimally include the following: (a) severity assessment
            and classification of an issue; (b) timeframe to remediate issues of different
            severity; and (c) risk assessment and mitigation strategies to manage
            deviations from the framework.'
  - id: trmg-g-14
    class: trmg-chapter
    title: Online Financial Services
    props:
    - name: label
      value: '14'
    groups:
    - id: trmg-g-14.1
      class: trmg-section
      title: Security of Online Financial Services
      props:
      - name: label
        value: '14.1'
      controls:
      - id: trmg-14.1.1
        class: trmg-guideline
        title: TRMG 14.1.1
        props:
        - name: label
          value: 14.1.1
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.1_smt
          name: statement
          prose: Online financial services include banking, trading, insurance, or
            other financial and payment services that are provisioned via the Internet.
            [34](#4811b6b4-bd2e-560c-8b01-a71313b83741) In delivering online financial
            services, the FI should implement security and control measures which
            are commensurate with the risk involved to ensure the security of data
            and online services.
        links:
        - href: '#4811b6b4-bd2e-560c-8b01-a71313b83741'
          rel: reference
          text: Footnote 34
      - id: trmg-14.1.2
        class: trmg-guideline
        title: TRMG 14.1.2
        props:
        - name: label
          value: 14.1.2
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.2_smt
          name: statement
          prose: The FI should secure its communications channels to protect customer
            data. This can be achieved through data encryption and digital signatures.
      - id: trmg-14.1.3
        class: trmg-guideline
        title: TRMG 14.1.3
        props:
        - name: label
          value: 14.1.3
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.3_smt
          name: statement
          prose: Adequate measures should also be taken to minimise exposure of the
            FI’s online financial services to common attack vectors such as code injection
            attack, cross-site scripting, man-in-the-middle attack (MITMA), [35](#8556e366-106c-58bc-9fce-caeb9e41ff05)
            domain name system (DNS) hijacking, [36](#ee5b6ad6-1f3c-5141-8c29-1be118cca262)
            distributed denial of service (DDoS), malware and spoofing attacks.
        links:
        - href: '#8556e366-106c-58bc-9fce-caeb9e41ff05'
          rel: reference
          text: Footnote 35
        - href: '#ee5b6ad6-1f3c-5141-8c29-1be118cca262'
          rel: reference
          text: Footnote 36
      - id: trmg-14.1.4
        class: trmg-guideline
        title: TRMG 14.1.4
        props:
        - name: label
          value: 14.1.4
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.4_smt
          name: statement
          prose: An FI offering online financial services access via a mobile device
            should be aware of the risks unique to mobile applications. Specific measures
            aimed at addressing the risks of mobile applications should be put in
            place. Refer to Annex C for guidance on Mobile Application Security.
      - id: trmg-14.1.5
        class: trmg-guideline
        title: TRMG 14.1.5
        props:
        - name: label
          value: 14.1.5
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.5_smt
          name: statement
          prose: The FI should only make available mobile applications or software
            to customers through official mobile application stores, or other secure
            delivery channels.
      - id: trmg-14.1.6
        class: trmg-guideline
        title: TRMG 14.1.6
        props:
        - name: label
          value: 14.1.6
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.6_smt
          name: statement
          prose: The FI should actively monitor for phishing campaigns targeting the
            FI and its customers. Immediate action should be taken to report phishing
            attempts to service providers to facilitate the removal of malicious content.
            The FI should alert its customers of such campaigns and advise them of
            security measures to adopt to protect against phishing.
      - id: trmg-14.1.7
        class: trmg-guideline
        title: TRMG 14.1.7
        props:
        - name: label
          value: 14.1.7
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.1.7_smt
          name: statement
          prose: Rooted or jailbroken mobile devices, which are more susceptible to
            malware and may have more security vulnerabilities, should be disallowed
            from accessing the FI’s mobile applications to perform financial transactions
            unless the application has been secured within a sandbox or container
            that insulates the application from tampering and interception by malware.
    - id: trmg-g-14.2
      class: trmg-section
      title: Customer Authentication and Transaction Signing
      props:
      - name: label
        value: '14.2'
      controls:
      - id: trmg-14.2.1
        class: trmg-guideline
        title: TRMG 14.2.1
        props:
        - name: label
          value: 14.2.1
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.1_smt
          name: statement
          prose: Multi-factor authentication should be deployed at login for online
            financial services to secure the customer authentication process. Multi-factor
            authentication can be based on two or more of the following factors, i.e.
            what you know (e.g. personal identification number or password), what
            you have (e.g. one-time password (OTP) generator) and who you are (e.g.
            biometrics).
      - id: trmg-14.2.2
        class: trmg-guideline
        title: TRMG 14.2.2
        props:
        - name: label
          value: 14.2.2
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.2_smt
          name: statement
          prose: End-to-end encryption should be implemented for the transmission
            of customer passwords so that they are not exposed at any intermediate
            nodes between the customer mobile application or browser and the IT system
            where passwords are verified. To safeguard the confidentiality of customer
            passwords, the passwords should only be verified in a hardened or tamper
            resistant system.
      - id: trmg-14.2.3
        class: trmg-guideline
        title: TRMG 14.2.3
        props:
        - name: label
          value: 14.2.3
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.3_smt
          name: statement
          prose: The FI should implement transaction-signing (e.g. digital signatures)
            for authorising high-risk activities to protect the integrity of customer
            accounts’ data and transaction details. High-risk activities include changes
            to sensitive customer data (e.g. customer office and home address, email
            and telephone contact details), registration of third party payee details,
            high value funds transfers and revision of funds transfer limits.
      - id: trmg-14.2.4
        class: trmg-guideline
        title: TRMG 14.2.4
        props:
        - name: label
          value: 14.2.4
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.4_smt
          name: statement
          prose: Besides login and transaction-signing for high-risk activities, the
            FI may implement appropriate risk-based or adaptive authentication that
            presents customers with authentication options that are commensurate with
            the risk level of the transaction and sensitivity of the data.
      - id: trmg-14.2.5
        class: trmg-guideline
        title: TRMG 14.2.5
        props:
        - name: label
          value: 14.2.5
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.5_smt
          name: statement
          prose: When implementing time-based OTPs, the FI should establish a validity
            period that is as short as practicable to lower the risk of a stolen OTP
            being used for fraudulent transactions.
      - id: trmg-14.2.6
        class: trmg-guideline
        title: TRMG 14.2.6
        props:
        - name: label
          value: 14.2.6
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.6_smt
          name: statement
          prose: Where biometric technologies [37](#d12b2109-72e7-5442-a303-01d962169fb3)
            and customer passwords are used for customer authentication, the FI should
            ensure the biometrics-related data and authentication credentials are
            encrypted in storage and during transmission.
        links:
        - href: '#d12b2109-72e7-5442-a303-01d962169fb3'
          rel: reference
          text: Footnote 37
      - id: trmg-14.2.7
        class: trmg-guideline
        title: TRMG 14.2.7
        props:
        - name: label
          value: 14.2.7
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.7_smt
          name: statement
          prose: The performance of the biometric solution, based on false acceptance
            rate (FAR) [38](#ba2ceb48-99c6-5f5a-a668-97125cdde92f) and false rejection
            rate (FRR), [39](#5cfd259e-4471-517d-8a29-238c55b1e703) should be calibrated
            to be commensurate with the risk associated with the online activity.
        links:
        - href: '#ba2ceb48-99c6-5f5a-a668-97125cdde92f'
          rel: reference
          text: Footnote 38
        - href: '#5cfd259e-4471-517d-8a29-238c55b1e703'
          rel: reference
          text: Footnote 39
      - id: trmg-14.2.8
        class: trmg-guideline
        title: TRMG 14.2.8
        props:
        - name: label
          value: 14.2.8
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.8_smt
          name: statement
          prose: A soft token is a software-based two-factor authentication mechanism
            installed on a general-purpose device. [40](#fbd0befd-c359-52f6-8e2b-f88c2ca3b76d)
            Appropriate measures, such as verifying the identity of the customer,
            detecting and blocking rooted or jailbroken devices, and performing device
            binding, [41](#2d1c7535-fbe3-5529-870d-bc56c0774abb) should be implemented
            during soft token provisioning.
        links:
        - href: '#fbd0befd-c359-52f6-8e2b-f88c2ca3b76d'
          rel: reference
          text: Footnote 40
        - href: '#2d1c7535-fbe3-5529-870d-bc56c0774abb'
          rel: reference
          text: Footnote 41
      - id: trmg-14.2.9
        class: trmg-guideline
        title: TRMG 14.2.9
        props:
        - name: label
          value: 14.2.9
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.9_smt
          name: statement
          prose: The FI should ensure the authenticated session, together with its
            encryption protocol, remains intact throughout the interaction with the
            customer. Measures to detect and terminate hijacked sessions should be
            implemented. To reduce the risk of an attacker from maintaining a hijacked
            session indefinitely, an online session should be automatically terminated
            after inactivity for a pre-defined time.
      - id: trmg-14.2.10
        class: trmg-guideline
        title: TRMG 14.2.10
        props:
        - name: label
          value: 14.2.10
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.10_smt
          name: statement
          prose: Where alternate controls and processes (e.g. maker-checker function)
            are implemented for corporate or institutional customers to authorise
            transactions, the FI should perform a security risk assessment of controls
            or processes to ensure they are commensurate with the risk of the activities
            that are being carried out.
      - id: trmg-14.2.11
        class: trmg-guideline
        title: TRMG 14.2.11
        props:
        - name: label
          value: 14.2.11
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.2.11_smt
          name: statement
          prose: To safeguard the confidentiality of authentication credentials, such
            as biometric templates and passwords, the FI should store these credentials
            in a form that is resistant to reverse engineering. A process and procedure
            should also be implemented to revoke and replace authentication credentials
            and mechanisms that have been compromised.
    - id: trmg-g-14.3
      class: trmg-section
      title: Fraud Monitoring
      props:
      - name: label
        value: '14.3'
      controls:
      - id: trmg-14.3.1
        class: trmg-guideline
        title: TRMG 14.3.1
        props:
        - name: label
          value: 14.3.1
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.3.1_smt
          name: statement
          prose: The FI should implement real-time fraud monitoring systems to identify
            and block suspicious or fraudulent online transactions. [42](#0da6ae22-e895-596c-adce-4c82902d0df4)
        links:
        - href: '#0da6ae22-e895-596c-adce-4c82902d0df4'
          rel: reference
          text: Footnote 42
      - id: trmg-14.3.2
        class: trmg-guideline
        title: TRMG 14.3.2
        props:
        - name: label
          value: 14.3.2
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.3.2_smt
          name: statement
          prose: A process should be established to investigate suspicious transactions
            or payments and to ensure issues are adequately and promptly addressed.
      - id: trmg-14.3.3
        class: trmg-guideline
        title: TRMG 14.3.3
        props:
        - name: label
          value: 14.3.3
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.3.3_smt
          name: statement
          prose: The FI should notify customers of suspicious activities or funds
            transfers above a threshold that is defined by the FI or customers. The
            notification should contain meaningful information such as type of transaction
            and payment amount, as well as instructions to report suspicious activities
            or unauthorised transactions.
    - id: trmg-g-14.4
      class: trmg-section
      title: Customer Education and Communication
      props:
      - name: label
        value: '14.4'
      controls:
      - id: trmg-14.4.1
        class: trmg-guideline
        title: TRMG 14.4.1
        props:
        - name: label
          value: 14.4.1
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.4.1_smt
          name: statement
          prose: Customers should be informed of the security best practices that
            they should adopt when using online financial services. This includes
            the measures to take to secure their electronic devices that are used
            to access online financial services.
      - id: trmg-14.4.2
        class: trmg-guideline
        title: TRMG 14.4.2
        props:
        - name: label
          value: 14.4.2
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.4.2_smt
          name: statement
          prose: The FI should alert its customers on a timely basis to new cyber
            threats so that they can take precautionary measures.
      - id: trmg-14.4.3
        class: trmg-guideline
        title: TRMG 14.4.3
        props:
        - name: label
          value: 14.4.3
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-14.4.3_smt
          name: statement
          prose: The FI should advise their customers on the means to detect unauthorised
            transactions and to report promptly security issues, suspicious activities
            or suspected fraud to the FI.
  - id: trmg-g-15
    class: trmg-chapter
    title: IT Audit
    props:
    - name: label
      value: '15'
    groups:
    - id: trmg-g-15.1
      class: trmg-section
      title: Audit Function
      props:
      - name: label
        value: '15.1'
      controls:
      - id: trmg-15.1.1
        class: trmg-guideline
        title: TRMG 15.1.1
        props:
        - name: label
          value: 15.1.1
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-15.1.1_smt
          name: statement
          prose: Audit plays an important role to assess the effectiveness of the
            controls, risk management and governance process in the FI. The FI should
            ensure IT audit is performed to provide the board of directors and senior
            management an independent and objective opinion of the adequacy and effectiveness
            of the FI’s risk management, governance and internal controls relative
            to its existing and emerging technology risks.
      - id: trmg-15.1.2
        class: trmg-guideline
        title: TRMG 15.1.2
        props:
        - name: label
          value: 15.1.2
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-15.1.2_smt
          name: statement
          prose: A comprehensive set of auditable areas for technology risk should
            be identified so that an effective risk assessment could be performed
            during audit planning. Auditable areas should include all IT operations,
            functions and processes.
      - id: trmg-15.1.3
        class: trmg-guideline
        title: TRMG 15.1.3
        props:
        - name: label
          value: 15.1.3
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-15.1.3_smt
          name: statement
          prose: The frequency of IT audits should be commensurate with the criticality
            of and risk posed by the IT information asset, function or process.
      - id: trmg-15.1.4
        class: trmg-guideline
        title: TRMG 15.1.4
        props:
        - name: label
          value: 15.1.4
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/trmg
        parts:
        - id: trmg-15.1.4_smt
          name: statement
          prose: The FI should ensure its IT auditors have the requisite level of
            competency and skills to effectively assess and evaluate the adequacy
            of IT policies, procedures, processes and controls implemented.
